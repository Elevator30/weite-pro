<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>土建勘测 V1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','微软雅黑',sans-serif;background:#f5f7fa;-webkit-overflow-scrolling:touch;overflow:hidden;height:100vh;}

/* ===== 主布局：左侧项目树 + 右侧内容区 ===== */
.app-container{display:flex;height:100vh;overflow:hidden;}

/* 左侧边栏 */
.sidebar{width:280px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-header{padding:14px 16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;flex-shrink:0;}
.sidebar-title{font-size:16px;font-weight:700;margin-bottom:2px;}
.sidebar-sub{font-size:11px;opacity:.85;letter-spacing:1px;}
.sidebar-actions{display:flex;gap:6px;margin-top:10px;}
.sidebar-btn{flex:1;padding:7px 0;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.sidebar-btn:active{background:rgba(255,255,255,.35);}

/* 项目树 */
.project-tree{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0;}
.tree-project{padding:8px 12px;cursor:pointer;position:relative;}
.tree-project:active{background:#f7fafc;}
.tree-project.active{background:#edf2ff;}
.tree-project.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:linear-gradient(180deg,#667eea,#764ba2);border-radius:0 3px 3px 0;}
.tree-proj-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tree-proj-name{font-size:13px;font-weight:600;color:#2d3748;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-proj-arrow{font-size:10px;color:#a0aec0;flex-shrink:0;transition:transform .2s;}
.tree-proj-arrow.expanded{transform:rotate(90deg);}
.tree-proj-meta{font-size:11px;color:#a0aec0;margin-top:2px;}
.tree-building{padding:6px 12px 6px 28px;cursor:pointer;position:relative;}
.tree-building:active{background:#f7fafc;}
.tree-building.active{background:#edf2ff;}
.tree-bldg-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tree-bldg-name{font-size:12px;font-weight:500;color:#4a5568;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-bldg-arrow{font-size:9px;color:#a0aec0;flex-shrink:0;transition:transform .2s;}
.tree-bldg-arrow.expanded{transform:rotate(90deg);}
.tree-elevator{padding:5px 12px 5px 44px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tree-elevator:active{background:#f7fafc;}
.tree-elevator.active{background:#edf2ff;}
.tree-elev-name{font-size:12px;color:#718096;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-elev-type{font-size:10px;color:#a0aec0;flex-shrink:0;}
.tree-add-btn{padding:6px 12px 6px 24px;font-size:12px;color:#667eea;cursor:pointer;font-weight:500;}
.tree-add-btn:active{background:#f0f4ff;}
.tree-add-btn.building-level{padding-left:28px;}
.tree-add-btn.elevator-level{padding-left:44px;font-size:11px;color:#764ba2;}
.tree-context-menu{position:absolute;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:999;overflow:hidden;display:none;min-width:120px;}
.tree-context-menu div{padding:10px 14px;font-size:13px;cursor:pointer;}
.tree-context-menu div:active{background:#f7fafc;}
.tree-context-menu .danger{color:#e53e3e;}

/* 右侧主内容区 */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* 顶部工具栏 */
.toolbar{padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.menu-toggle{width:36px;height:36px;border:none;background:#f7fafc;border-radius:8px;cursor:pointer;font-size:18px;color:#4a5568;flex-shrink:0;display:none;}
.toolbar-title{font-size:16px;font-weight:700;color:#2d3748;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toolbar-right{display:flex;gap:8px;flex-shrink:0;}
.toolbar-btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;}
.toolbar-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.25);}
.toolbar-btn.primary:active{opacity:.85;}
.toolbar-btn.secondary{background:#f7fafc;color:#4a5568;border:1.5px solid #e2e8f0;}
.toolbar-btn.secondary:active{background:#edf2f7;}
.toolbar-btn.danger{background:#fff5f5;color:#e53e3e;border:1.5px solid #fed7d7;}

/* 内容区域 */
.content-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}
.content-area::-webkit-scrollbar{width:6px;}
.content-area::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px;}

/* 空状态 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#a0aec0;text-align:center;padding:40px 20px;}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-text{font-size:14px;margin-bottom:20px;}
.empty-btn{padding:10px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}

/* ===== 卡片式设计 ===== */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card-title{font-size:15px;font-weight:700;color:#2d3748;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.card-title .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:#edf2ff;color:#667eea;}
.card-subtitle{font-size:12px;color:#718096;margin-bottom:10px;}

/* 表单行 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row{margin-bottom:12px;}
.form-row.full{grid-column:1/-1;}
.form-row label{display:block;font-size:12px;color:#4a5568;margin-bottom:4px;font-weight:500;}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 10px;font-size:13px;background:#fafafa;transition:all .15s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#667eea;background:#fff;outline:none;}
.form-row textarea{min-height:60px;resize:vertical;font-family:inherit;}
.form-hint{font-size:11px;color:#a0aec0;margin-top:3px;}

/* 分组标题 */
.section-header{font-size:13px;font-weight:700;color:#fff;padding:8px 12px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:8px 8px 0 0;margin:-16px -16px 12px;display:flex;align-items:center;justify-content:space-between;}
.section-header .section-count{font-size:11px;font-weight:500;opacity:.85;}


/* ===== 分区Tab ===== */
.zone-tabs{display:flex;gap:0;padding:0 8px;background:#fff;overflow-x:auto;flex-shrink:0;
  -webkit-overflow-scrolling:touch;border-bottom:2px solid #edf2f7;}
.zone-tabs::-webkit-scrollbar{display:none;}
.zone-tab{padding:12px 14px;white-space:nowrap;font-size:13px;font-weight:600;color:#718096;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;flex-shrink:0;}
.zone-tab.active{color:#667eea;border-bottom-color:#667eea;}
.zone-panel{display:none;animation:fadeIn .2s ease;}
.zone-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ===== 楼层纵向卡片 ===== */
.floor-cards{display:flex;flex-direction:column;gap:10px;}
.floor-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);position:relative;}
.floor-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px dashed #edf2f7;}
.floor-no-badge{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;
  font-weight:700;padding:4px 12px;border-radius:20px;min-width:50px;text-align:center;}
.floor-del-btn{background:none;border:none;color:#e53e3e;cursor:pointer;font-size:18px;
  padding:2px 8px;line-height:1;}
.floor-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.floor-row:last-child{margin-bottom:0;}
.floor-field{flex:1;min-width:0;}
.floor-field label{display:block;font-size:11px;color:#718096;margin-bottom:3px;font-weight:500;}
.floor-field input{width:100%;border:1.5px solid #e2e8f0;border-radius:6px;padding:6px 8px;
  font-size:13px;background:#fafafa;text-align:center;}
.floor-field input:focus{border-color:#667eea;background:#fff;outline:none;}
.floor-field.w40{flex:0 0 40%;}
.floor-field.w30{flex:0 0 30%;}
.floor-field.w25{flex:0 0 25%;}
.floor-field.w20{flex:0 0 20%;}
.floor-door-pos{display:flex;gap:4px;}
.floor-door-pos button{flex:1;padding:6px 2px;border:1.5px solid #e2e8f0;border-radius:6px;
  font-size:12px;cursor:pointer;background:#fff;color:#718096;font-weight:600;}
.floor-door-pos button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;}
.floor-remark-field{width:100%;}
.floor-remark-field input{text-align:left;}
.floor-divider{height:1px;background:#edf2f7;margin:8px 0;}
.floor-label{font-size:11px;color:#a0aec0;margin-right:4px;flex-shrink:0;}

/* 楼层操作栏 */
.floor-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.floor-toolbar-btn{padding:7px 12px;border:none;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:4px;flex-shrink:0;}
.floor-toolbar-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.floor-toolbar-btn.secondary{background:#f7fafc;color:#4a5568;border:1.5px solid #e2e8f0;}
.floor-toolbar-btn.danger{background:#fff5f5;color:#e53e3e;border:1.5px solid #fed7d7;}

/* 楼层统计栏 */
.floor-stats-bar{display:flex;gap:12px;margin-bottom:12px;padding:10px 12px;
  background:linear-gradient(135deg,#f0f4ff,#f7f0ff);border-radius:8px;font-size:12px;flex-wrap:wrap;}
.floor-stat{display:flex;align-items:center;gap:5px;}
.floor-stat-label{color:#718096;font-size:11px;}
.floor-stat-val{font-weight:700;color:#2d3748;}
.floor-stat-val.min{color:#38a169;}
.floor-stat-val.max{color:#e53e3e;}

/* ===== 井道结构墙组 ===== */
.wall-group{background:#f7fafc;border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.wall-group-title{font-size:12px;font-weight:700;color:#667eea;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;}
.wall-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wall-form-grid .form-row{margin-bottom:0;}
.wall-form-grid .form-row.full{grid-column:1/-1;}

/* ===== 签字日期行 ===== */
.sig-date-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.sig-date-row label{font-size:11px;color:#718096;white-space:nowrap;}
.sig-date-row input{flex:1;border:1.5px solid #e2e8f0;border-radius:6px;padding:6px 8px;
  font-size:12px;background:#fafafa;}
.sig-date-row input:focus{border-color:#667eea;background:#fff;outline:none;}

/* ===== 子分组标题 ===== */
.sub-section-title{font-size:13px;font-weight:700;color:#2d3748;margin:14px 0 8px;
  display:flex;align-items:center;gap:6px;}
.sub-section-title:first-child{margin-top:0;}
.sub-section-title::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,#667eea,#764ba2);border-radius:2px;}

/* ===== 分层测量表 ===== */
.floor-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #e2e8f0;border-radius:8px;}
.floor-table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px;}
.floor-table th{background:#f7fafc;font-weight:600;color:#4a5568;padding:8px 6px;text-align:center;border-bottom:2px solid #e2e8f0;position:sticky;top:0;white-space:nowrap;}
.floor-table td{padding:6px 4px;text-align:center;border-bottom:1px solid #edf2f7;}
.floor-table input{width:100%;border:1px solid #e2e8f0;border-radius:5px;padding:5px 4px;font-size:12px;text-align:center;background:#fff;}
.floor-table input:focus{border-color:#667eea;outline:none;}
.floor-table .floor-no{width:70px;}
.floor-table .del-col{width:40px;}
.floor-del-btn{background:none;border:none;color:#e53e3e;cursor:pointer;font-size:16px;padding:4px;}
.floor-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.floor-btn{padding:7px 12px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;}
.floor-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.floor-btn.secondary{background:#f7fafc;color:#4a5568;border:1.5px solid #e2e8f0;}
.floor-btn.danger{background:#fff5f5;color:#e53e3e;border:1.5px solid #fed7d7;}
.floor-stats{display:flex;gap:16px;margin-top:10px;padding:10px 12px;background:#f7fafc;border-radius:8px;font-size:12px;}
.floor-stat-item{display:flex;align-items:center;gap:6px;}
.floor-stat-label{color:#718096;}
.floor-stat-value{font-weight:700;color:#2d3748;}
.floor-stat-value.min{color:#38a169;}
.floor-stat-value.max{color:#e53e3e;}

/* 开门位置选择器 */
.door-pos-select{display:flex;gap:4px;}
.door-pos-btn{flex:1;padding:4px 2px;border:1px solid #e2e8f0;border-radius:5px;font-size:11px;cursor:pointer;background:#fff;color:#718096;}
.door-pos-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;}

/* ===== 示意图上传 ===== */
.sketch-area{display:flex;flex-wrap:wrap;gap:10px;}
.sketch-thumb{width:90px;height:90px;border-radius:8px;overflow:hidden;position:relative;border:1.5px solid #e2e8f0;cursor:pointer;}
.sketch-thumb img{width:100%;height:100%;object-fit:cover;}
.sketch-del{position:absolute;top:0;right:0;background:rgba(229,62,62,.9);color:#fff;border:none;border-radius:0 7px 0 7px;font-size:14px;cursor:pointer;padding:2px 8px;line-height:1.2;}
.sketch-add{width:90px;height:90px;border:2px dashed #cbd5e0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;gap:2px;}
.sketch-add:active{background:#f0f0f0;border-color:#a0aec0;}
.sketch-add-icon{font-size:28px;color:#a0aec0;line-height:1;}
.sketch-add-text{font-size:11px;color:#a0aec0;}

/* ===== 签字区域 ===== */
.signature-section{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.sig-item{text-align:center;}
.sig-item label{display:block;font-size:12px;color:#4a5568;margin-bottom:6px;font-weight:500;}
.sig-area{border:2px dashed #cbd5e0;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;}
.sig-area:active{background:#f0f4f8;}
.sig-area img{max-height:75px;max-width:95%;}
.sig-area span{font-size:12px;color:#aaa;}
.sig-clear-btn{margin-top:4px;font-size:11px;color:#a0aec0;background:none;border:none;cursor:pointer;}


/* ===== 电梯类别选择器 ===== */
.elev-category-tabs{display:flex;gap:0;margin-bottom:16px;background:#f7fafc;border-radius:10px;padding:3px;border:1.5px solid #e2e8f0;}
.elev-category-tab{flex:1;padding:10px 8px;text-align:center;font-size:13px;font-weight:600;color:#718096;cursor:pointer;border-radius:8px;transition:all .2s;border:none;background:transparent;}
.elev-category-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 2px 6px rgba(102,126,234,.3);}
.elev-category-tab:active{opacity:.8;}
.elev-form-section{display:none;}
.elev-form-section.active{display:block;}

/* ===== 模态框 ===== */
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:20px;}
.modal-mask.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:420px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;}
.modal-header{padding:14px 16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-header h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
.modal-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
.modal-footer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #edf2f7;flex-shrink:0;}
.modal-btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
.modal-btn.cancel{background:#f7fafc;color:#718096;border:1.5px solid #e2e8f0;}
.modal-btn.confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}

/* 签字模态框 */
.sig-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2999;align-items:center;justify-content:center;}
.sig-modal.show{display:flex;}
.sig-canvas-wrap{background:#fff;width:95%;max-width:800px;border-radius:12px;overflow:hidden;}
.sig-canvas-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.sig-canvas-header h3{font-size:15px;font-weight:600;}
.sig-canvas-header button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.sig-canvas-body{background:#fff;height:280px;touch-action:none;padding:10px;}
.sig-canvas-body canvas{width:100%;height:100%;display:block;border:2px solid #e2e8f0;border-radius:8px;}
.sig-canvas-footer{display:flex;gap:10px;padding:12px;background:#fff;}
.sig-canvas-footer button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.sig-clear{background:#f7fafc;color:#666;border:1.5px solid #e2e8f0;}
.sig-save{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;display:none;}

/* ===== 打印区域 ===== */
.print-area{display:none;}

/* ===== 响应式：移动端 ===== */
@media (max-width: 768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .3s;width:80%;max-width:320px;box-shadow:2px 0 12px rgba(0,0,0,.1);}
  .sidebar.show{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:99;}
  .sidebar-overlay.show{display:block;}
  .menu-toggle{display:block;}
  .form-grid{grid-template-columns:1fr;}
  .signature-section{grid-template-columns:1fr;}
  .content-area{padding:12px;}
  .card{padding:14px;margin-bottom:12px;}
  .section-header{margin:-14px -14px 12px;}
  .toolbar-title{font-size:15px;}
  .toolbar-btn{padding:7px 10px;font-size:12px;}
  .floor-stats{flex-wrap:wrap;gap:10px;}
  .zone-tabs{padding:0 4px;}
  .zone-tab{padding:10px 10px;font-size:12px;}
  .wall-form-grid{grid-template-columns:1fr;}
  .floor-row{flex-wrap:wrap;}
  .floor-field.w25{flex:0 0 calc(50% - 4px);}
  .floor-field.w30{flex:0 0 40%;}
  .floor-field.w40{flex:0 0 100%;}
}

/* ===== 打印样式 ===== */
@media print{
  body{background:#fff;padding:0;overflow:visible;height:auto;}
  .no-print{display:none!important;}
  .print-area{display:block;}
  .app-container{display:none;}
}
</style>
</head>
<body>

<div class="app-container no-print">
  <!-- 左侧边栏 -->

<script>
// ===== IndexedDB 封装 (带localStorage降级, 内存缓存) =====
var _idb = null;
var _idbReady = false;
var _idbQueue = [];
var DB_NAME = 'WeiteCivil';
var DB_VERSION = 1;
var STORE_NAME = 'civilProjects';

function _idbInit(){
  if (typeof indexedDB === 'undefined') { _idbReady = 'fallback'; return; }
  var req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = function(e) {
    var db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      var store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      store.createIndex('updateTime', 'updateTime', { unique: false });
    }
  };
  req.onsuccess = function(e) {
    _idb = e.target.result;
    _idbReady = true;
    while (_idbQueue.length > 0) {
      try { _idbQueue.shift()(); } catch (err) { console.error('IDB队列错误', err); }
    }
  };
  req.onerror = function() {
    console.warn('IndexedDB打开失败，降级使用localStorage');
    _idbReady = 'fallback';
  };
}
function _idbExec(fn) {
  if (_idbReady === true) { try { fn(); } catch (e) { console.error('IDB执行错误', e); } }
  else if (_idbReady === 'fallback') { try { fn(); } catch (e) {} }
  else { _idbQueue.push(fn); }
}
function dbGetAll(cb) {
  _idbExec(function() {
    if (_idbReady === 'fallback') {
      try {
        var raw = localStorage.getItem('civilProjects');
        cb(raw ? JSON.parse(raw) : [], null);
      } catch (e) { cb([], e); }
      return;
    }
    try {
      var tx = _idb.transaction(STORE_NAME, 'readonly');
      var r = tx.objectStore(STORE_NAME).getAll();
      r.onsuccess = function() { cb(r.result || [], null); };
      r.onerror = function() { cb([], r.error); };
    } catch (e) { cb([], e); }
  });
}
function dbPut(item, cb) {
  _idbExec(function() {
    if (_idbReady === 'fallback') {
      try {
        var all = [];
        var raw = localStorage.getItem('civilProjects');
        if (raw) all = JSON.parse(raw);
        var idx = -1;
        for (var i = 0; i < all.length; i++) {
          if (all[i].id === item.id) { idx = i; break; }
        }
        if (idx >= 0) all[idx] = item; else all.push(item);
        localStorage.setItem('civilProjects', JSON.stringify(all));
        cb && cb(null);
      } catch (e) { cb && cb(e); }
      return;
    }
    try {
      var tx = _idb.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(item);
      tx.oncomplete = function() { cb && cb(null); };
      tx.onerror = function() { cb && cb(tx.error); };
    } catch (e) { cb && cb(e); }
  });
}
function dbDelete(id, cb) {
  _idbExec(function() {
    if (_idbReady === 'fallback') {
      try {
        var all = [];
        var raw = localStorage.getItem('civilProjects');
        if (raw) all = JSON.parse(raw);
        all = all.filter(function(p) { return p.id !== id; });
        localStorage.setItem('civilProjects', JSON.stringify(all));
        cb && cb(null);
      } catch (e) { cb && cb(e); }
      return;
    }
    try {
      var tx = _idb.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = function() { cb && cb(null); };
      tx.onerror = function() { cb && cb(tx.error); };
    } catch (e) { cb && cb(e); }
  });
}
_idbInit();

// ===== 内存缓存层 =====
var projects = []; // 内存缓存：项目列表（含完整数据）
var currentProjectId = null;
var currentBuildingId = null;
var currentElevatorId = null;
var expandedProjects = {}; // 项目展开状态
var expandedBuildings = {}; // 楼栋展开状态

// 待删除项缓存
var pendingDelete = { type: null, projectId: null, buildingId: null, elevatorId: null };

// 重命名缓存
var renameTarget = { type: null, projectId: null, buildingId: null, elevatorId: null };

// 签字状态
var currentSigField = null;
var sigCtx = null;
var isDrawing = false;

// ===== 工具函数 =====
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}
function showToast(msg, duration) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.style.display = 'none'; }, duration || 2000);
}
function showModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  sb.classList.toggle('show');
  ov.classList.toggle('show');
}

// ===== 数据加载与保存 =====
function loadAllProjects(cb) {
  dbGetAll(function(list, err) {
    if (err) { console.error('加载失败', err); showToast('数据加载失败'); }
    projects = list || [];
    // 按更新时间倒序
    projects.sort(function(a, b) { return (b.updateTime || 0) - (a.updateTime || 0); });
    renderProjectTree();
    cb && cb();
  });
}

function saveCurrentProject() {
  var proj = getProject(currentProjectId);
  if (!proj) return;
  proj.updateTime = Date.now();
  dbPut(proj, function(err) {
    if (err) showToast('保存失败');
  });
}

function saveData() {
  saveCurrentProject();
  showToast('已保存');
}

// ===== 数据访问辅助函数 =====
function getProject(id) {
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id === id) return projects[i];
  }
  return null;
}
function getBuilding(proj, bldgId) {
  if (!proj || !proj.buildings) return null;
  for (var i = 0; i < proj.buildings.length; i++) {
    if (proj.buildings[i].id === bldgId) return proj.buildings[i];
  }
  return null;
}
function getElevator(bldg, elevId) {
  if (!bldg || !bldg.elevators) return null;
  for (var i = 0; i < bldg.elevators.length; i++) {
    if (bldg.elevators[i].id === elevId) return bldg.elevators[i];
  }
  return null;
}
function getCurrentElevator() {
  var proj = getProject(currentProjectId);
  if (!proj) return null;
  var bldg = getBuilding(proj, currentBuildingId);
  if (!bldg) return null;
  return getElevator(bldg, currentElevatorId);
}

// ===== 项目树渲染 =====
function renderProjectTree() {
  var tree = document.getElementById('projectTree');
  if (!projects.length) {
    tree.innerHTML = '<div style="padding:30px 20px;text-align:center;color:#a0aec0;font-size:12px;">暂无项目<br>点击上方"新建"创建</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var isProjActive = p.id === currentProjectId;
    var isExpanded = !!expandedProjects[p.id];
    html += '<div class="tree-project ' + (isProjActive ? 'active' : '') + '" onclick="selectProject(\'' + p.id + '\')" oncontextmenu="showProjMenu(event,\'' + p.id + '\');return false;">';
    html += '<div class="tree-proj-top">';
    html += '<span class="tree-proj-arrow ' + (isExpanded ? 'expanded' : '') + '" onclick="event.stopPropagation();toggleProject(\'' + p.id + '\')">▶</span>';
    html += '<span class="tree-proj-name">' + escapeHtml(p.name) + '</span>';
    html += '</div>';
    html += '<div class="tree-proj-meta">' + (p.location || '未设置地址') + '</div>';
    html += '</div>';
    
    if (isExpanded && p.buildings && p.buildings.length) {
      for (var j = 0; j < p.buildings.length; j++) {
        var b = p.buildings[j];
        var isBldgActive = b.id === currentBuildingId && isProjActive;
        var isBldgExpanded = !!expandedBuildings[b.id];
        html += '<div class="tree-building ' + (isBldgActive ? 'active' : '') + '" onclick="event.stopPropagation();selectBuilding(\'' + p.id + '\',\'' + b.id + '\')" oncontextmenu="showBldgMenu(event,\'' + p.id + '\',\'' + b.id + '\');return false;">';
        html += '<div class="tree-bldg-top">';
        html += '<span class="tree-bldg-arrow ' + (isBldgExpanded ? 'expanded' : '') + '" onclick="event.stopPropagation();toggleBuilding(\'' + b.id + '\')">▶</span>';
        html += '<span class="tree-bldg-name">' + escapeHtml(b.name) + '</span>';
        html += '</div>';
        html += '</div>';
        
        if (isBldgExpanded && b.elevators && b.elevators.length) {
          for (var k = 0; k < b.elevators.length; k++) {
            var e = b.elevators[k];
            var isElevActive = e.id === currentElevatorId && isBldgActive;
            html += '<div class="tree-elevator ' + (isElevActive ? 'active' : '') + '" onclick="event.stopPropagation();selectElevator(\'' + p.id + '\',\'' + b.id + '\',\'' + e.id + '\')" oncontextmenu="showElevMenu(event,\'' + p.id + '\',\'' + b.id + '\',\'' + e.id + '\');return false;">';
            html += '<span class="tree-elev-name">' + escapeHtml(e.elevatorNo || '未命名') + '</span>';
            var typeLabel = '';
            if (e.category === 'escalator') { typeLabel = '扶梯'; }
            else { typeLabel = e.elevatorType || '垂直电梯'; }
            html += '<span class="tree-elev-type">' + escapeHtml(typeLabel) + '</span>';
            html += '</div>';
          }
        }
        html += '<div class="tree-add-btn elevator-level" onclick="event.stopPropagation();openNewElevator(\'' + p.id + '\',\'' + b.id + '\')">+ 添加电梯</div>';
      }
    }
    if (isExpanded) {
      html += '<div class="tree-add-btn building-level" onclick="event.stopPropagation();openNewBuilding(\'' + p.id + '\')">+ 添加楼栋</div>';
    }
  }
  tree.innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function updateToolbar() {
  var title = document.getElementById('toolbarTitle');
  var saveBtn = document.getElementById('saveBtn');
  var printBtn = document.getElementById('printBtn');
  var proj = getProject(currentProjectId);
  
  if (!proj) {

    saveBtn.style.display = 'none';
    printBtn.style.display = 'none';
    return;
  }
  
  var bldg = getBuilding(proj, currentBuildingId);
  var elev = getCurrentElevator();
  
  if (elev) {
    title.textContent = proj.name + ' / ' + (bldg ? bldg.name : '') + ' / ' + (elev.elevatorNo || '未命名');
    saveBtn.style.display = 'flex';
    printBtn.style.display = 'flex';
  } else if (bldg) {
    title.textContent = proj.name + ' / ' + bldg.name;
    saveBtn.style.display = 'none';
    printBtn.style.display = 'none';
  } else {
    title.textContent = proj.name;
    saveBtn.style.display = 'none';
    printBtn.style.display = 'none';
  }

function renderEmptyOrContent() {
  var empty = document.getElementById('emptyState');
  var content = document.getElementById('elevatorContent');
  var tabsEl = document.getElementById('zoneTabs');
  var elev = getCurrentElevator();
  
  if (elev) {
    empty.style.display = 'none';
    content.style.display = 'block';
    if (tabsEl) tabsEl.style.display = 'flex';
    renderElevatorContent();
  } else {
    content.style.display = 'none';
    empty.style.display = 'flex';
    if (tabsEl) tabsEl.style.display = 'none';
    var proj = getProject(currentProjectId);
    if (proj) {
      var bldg = getBuilding(proj, currentBuildingId);

        empty.querySelector('.empty-text').textContent = '当前楼栋暂无电梯，点击添加电梯';

function confirmDelete() {
  var pd = pendingDelete;
  if (pd.type === 'project') {
    var idx = -1;
    for (var i = 0; i < projects.length; i++) {
      if (projects[i].id === pd.projectId) { idx = i; break; }
    }
    if (idx >= 0) projects.splice(idx, 1);
    dbDelete(pd.projectId);
    if (currentProjectId === pd.projectId) {
      currentProjectId = null;
      currentBuildingId = null;
      currentElevatorId = null;
    }
    showToast('项目已删除');
  } else if (pd.type === 'building') {
    var proj = getProject(pd.projectId);
    if (proj && proj.buildings) {
      proj.buildings = proj.buildings.filter(function(b) { return b.id !== pd.buildingId; });
      proj.updateTime = Date.now();
      dbPut(proj);
    }
    if (currentBuildingId === pd.buildingId) {
      currentBuildingId = null;
      currentElevatorId = null;
    }
    showToast('楼栋已删除');
  } else if (pd.type === 'elevator') {
    var proj2 = getProject(pd.projectId);
    var bldg2 = getBuilding(proj2, pd.buildingId);
    if (bldg2 && bldg2.elevators) {
      bldg2.elevators = bldg2.elevators.filter(function(e) { return e.id !== pd.elevatorId; });
      proj2.updateTime = Date.now();
      dbPut(proj2);
    }
    if (currentElevatorId === pd.elevatorId) {
      currentElevatorId = null;
    }
    showToast('电梯已删除');
  }
  
  closeModal('confirmModal');
  pendingDelete = { type: null };
  renderProjectTree();
  updateToolbar();
  renderEmptyOrContent();
}


// ===== 分区Tab管理 =====
var currentTabIndex = 0;
var tabNames = ['基本参数', '楼层测量', '井道结构', '机房底坑', '示意图', '签字'];

function renderZoneTabs() {
  var tabsEl = document.getElementById('zoneTabs');
  if (!tabsEl) return;
  var html = '';
  for (var i = 0; i < tabNames.length; i++) {
    var active = i === currentTabIndex ? ' active' : '';
    html += '<div class="zone-tab' + active + '" onclick="switchTab(' + i + ')">' + tabNames[i] + '</div>';
  }
  tabsEl.innerHTML = html;
}

function switchTab(index) {
  var elev = getCurrentElevator();
  if (elev && elev.category === 'escalator') {
    switchEscalatorTab(index);
    return;
  }
  if (index < 0 || index >= tabNames.length) return;
  currentTabIndex = index;
  renderZoneTabs();
  renderElevatorContent();
  // 滚动到顶部
  var contentArea = document.getElementById('contentArea');
  if (contentArea) contentArea.scrollTop = 0;
}

// ===== 电梯内容渲染 =====
function renderElevatorContent() {
  var elev = getCurrentElevator();
  if (!elev) return;
  
  // 显示tab栏
  var tabsEl = document.getElementById('zoneTabs');
  if (tabsEl) tabsEl.style.display = 'flex';
  
  // Check if escalator
  if (elev.category === 'escalator') {
    renderEscalatorContent(elev);
    return;
  }
  
  // Vertical elevator
  renderZoneTabs();
  
  var html = '';
  
  // Tab面板
  for (var i = 0; i < tabNames.length; i++) {
    var active = i === currentTabIndex ? ' active' : '';
    html += '<div class="zone-panel' + active + '" id="zonePanel_' + i + '">';
    
    if (i === 0) html += renderBasicInfoTab(elev);
    else if (i === 1) html += renderFloorTab(elev);
    else if (i === 2) html += renderShaftStructureTab(elev);
    else if (i === 3) html += renderMachinePitTab(elev);
    else if (i === 4) html += renderSketchesTab(elev);
    else if (i === 5) html += renderSignatureTab(elev);
    
    html += '</div>';
  }
  
  document.getElementById('elevatorContent').innerHTML = html;
  updateFloorStats();
}

function formField(label, id, value, type, onChange, fullWidth, options, step) {
  var fullCls = fullWidth ? ' full' : '';
  var html = '<div class="form-row' + fullCls + '">';
  html += '<label>' + label + '</label>';
  if (type === 'select') {
    html += '<select id="' + id + '" onchange="' + onChange + '(\'' + id + '\', this.value)">';
    for (var i = 0; i < options.length; i++) {
      var sel = value === options[i][0] ? 'selected' : '';
      html += '<option value="' + options[i][0] + '" ' + sel + '>' + options[i][1] + '</option>';
    }
    html += '</select>';
  } else if (type === 'textarea') {
    html += '<textarea id="' + id + '" onblur="' + onChange + '(\'' + id + '\', this.value)" placeholder="请输入' + label + '">' + value + '</textarea>';
  } else {
    var stepAttr = step ? ' step="' + step + '"' : '';
    html += '<input type="' + type + '" id="' + id + '" value="' + escapeHtml(value) + '" onblur="' + onChange + '(\'' + id + '\', this.value)"' + stepAttr + ' placeholder="请输入' + label + '">';
  }
  html += '</div>';
  return html;
}

var escalatorTabNames = ['基本信息', '现场测量', '示意图', '签字'];
var currentEscalatorTabIndex = 0;

function renderEscalatorZoneTabs() {
  var tabsEl = document.getElementById('zoneTabs');
  if (!tabsEl) return;
  var html = '';
  for (var i = 0; i < escalatorTabNames.length; i++) {
    var active = i === currentEscalatorTabIndex ? ' active' : '';
    html += '<div class="zone-tab' + active + '" onclick="switchEscalatorTab(' + i + ')">' + escalatorTabNames[i] + '</div>';
  }
  tabsEl.innerHTML = html;
}

function switchEscalatorTab(index) {
  if (index < 0 || index >= escalatorTabNames.length) return;
  currentEscalatorTabIndex = index;
  renderEscalatorZoneTabs();
  renderEscalatorContent(getCurrentElevator());
  var contentArea = document.getElementById('contentArea');
  if (contentArea) contentArea.scrollTop = 0;
}

function renderEscalatorContent(elev) {
  if (!elev) return;
  var tabsEl = document.getElementById('zoneTabs');
  if (tabsEl) tabsEl.style.display = 'flex';
  renderEscalatorZoneTabs();
  
  var html = '';
  for (var i = 0; i < escalatorTabNames.length; i++) {
    var active = i === currentEscalatorTabIndex ? ' active' : '';
    html += '<div class="zone-panel' + active + '" id="escZonePanel_' + i + '">';
    if (i === 0) html += renderEscalatorBasicTab(elev);
    else if (i === 1) html += renderEscalatorMeasurementTab(elev);
    else if (i === 2) html += renderSketchesTab(elev);
    else if (i === 3) html += renderSignatureTab(elev);
    html += '</div>';
  }
  document.getElementById('elevatorContent').innerHTML = html;
}

function deleteLastFloor() {
  var elev = getCurrentElevator();
  if (!elev || !elev.floorData || !elev.floorData.length) return;
  var sorted = getSortedFloorData();
  var lastFloor = sorted[sorted.length - 1];
  if (!confirm('确定删除最顶层 ' + lastFloor.floorNo + ' 层吗？')) return;
  var origIdx = elev.floorData.indexOf(lastFloor);
  if (origIdx >= 0) elev.floorData.splice(origIdx, 1);
  saveCurrentProject();
  renderElevatorContent();
}

  showModal('batchFloorModal');

function batchGenerateFloors() {
  var start = parseInt(document.getElementById('bf_start').value);
  var end = parseInt(document.getElementById('bf_end').value);
  var height = parseInt(document.getElementById('bf_height').value) || 3000;
  
  if (isNaN(start) || isNaN(end)) {
    showToast('请输入有效的楼层范围');
    return;
  }
  if (start >= end) {
    showToast('起始楼层必须小于结束楼层');
    return;
  }
  
  var elev = getCurrentElevator();
  if (!elev) return;
  if (!elev.floorData) elev.floorData = [];
  
  var newCount = 0;
  for (var f = start; f <= end; f++) {
    if (f === 0) continue; // 跳过0层
    // 检查是否已存在
    var exists = false;
    for (var i = 0; i < elev.floorData.length; i++) {
      if (parseFloat(elev.floorData[i].floorNo) === f) { exists = true; break; }
    }
    if (!exists) {
      elev.floorData.push({
        floorNo: f.toString(),
        floorHeight: height.toString(),
        shaftWidth: '',
        shaftDepth: '',
        doorWidth: '',
        doorHeight: '',
        pierLeft: '',
        pierRight: '',
        lintelHeight: '',
        lintelWidth: '',
        doorPosition: '前门',
        remark: ''
      });
      newCount++;
    }
  }
  
  saveCurrentProject();
  closeModal('batchFloorModal');
  renderElevatorContent();
  showToast('已生成 ' + newCount + ' 个楼层');
}

function updateFloorStats() {
  var elev = getCurrentElevator();
  if (!elev || !elev.floorData || !elev.floorData.length) return;
  
  var widths = [], depths = [];
  for (var i = 0; i < elev.floorData.length; i++) {
    var f = elev.floorData[i];
    if (f.shaftWidth && !isNaN(parseFloat(f.shaftWidth))) widths.push(parseFloat(f.shaftWidth));
    if (f.shaftDepth && !isNaN(parseFloat(f.shaftDepth))) depths.push(parseFloat(f.shaftDepth));
  }
  
  var widthMin = widths.length ? Math.min.apply(null, widths) : null;
  var widthMax = widths.length ? Math.max.apply(null, widths) : null;
  var depthMin = depths.length ? Math.min.apply(null, depths) : null;
  var depthMax = depths.length ? Math.max.apply(null, depths) : null;
  
  var wMinEl = document.getElementById('statWidthMin');
  var wMaxEl = document.getElementById('statWidthMax');
  var dMinEl = document.getElementById('statDepthMin');
  var dMaxEl = document.getElementById('statDepthMax');
  var countEl = document.getElementById('floorCountBadge');
  
  if (wMinEl) wMinEl.textContent = widthMin !== null ? widthMin + ' mm' : '--';
  if (wMaxEl) wMaxEl.textContent = widthMax !== null ? widthMax + ' mm' : '--';
  if (dMinEl) dMinEl.textContent = depthMin !== null ? depthMin + ' mm' : '--';
  if (dMaxEl) dMaxEl.textContent = depthMax !== null ? depthMax + ' mm' : '--';
  if (countEl) countEl.textContent = '共 ' + elev.floorData.length + ' 层';
}

function addSketch(useCamera) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if (useCamera) input.capture = 'environment';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    processSketchFile(file);
  };
  input.click();
}

function processSketchFile(file) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxSize = 1280;
      var w = img.width, h = img.height;
      if (w > h) {
        if (w > maxSize) { h = h * maxSize / w; w = maxSize; }
      } else {
        if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
      }

  surveyor: '测量及申请人签字',
  reviewer: '审核签字',

function openSigModal(field) {
  currentSigField = field;
  document.getElementById('sigModalTitle').textContent = sigTitles[field] || '手写签名';
  document.getElementById('sigModal').classList.add('show');
  setTimeout(initSigCanvas, 50);
}

function closeSigModal() {
  document.getElementById('sigModal').classList.remove('show');
}

function initSigCanvas() {
  var canvas = document.getElementById('sigCanvas');
  var container = document.getElementById('sigCanvasBody');
  var w = container.offsetWidth - 20;
  var h = container.offsetHeight - 20;
  if (!w || w < 50) {
    var rect = container.getBoundingClientRect();
    w = rect.width - 20 || window.innerWidth * 0.9;
    h = rect.height - 20 || 260;
  }
  canvas.width = w || 300;
  canvas.height = h || 200;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#000';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  
  // 如果已有签名，先画上去
  var elev = getCurrentElevator();
  if (elev && elev.signatures && elev.signatures[currentSigField]) {
    var img = new Image();
    img.onload = function() {
      sigCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = elev.signatures[currentSigField];
  }
  
  canvas.onmousedown = startDraw;
  canvas.onmousemove = draw;
  canvas.onmouseup = stopDraw;
  canvas.onmouseleave = stopDraw;
  canvas.ontouchstart = function(e) { e.preventDefault(); startDraw(e.touches[0]); };
  canvas.ontouchmove = function(e) { e.preventDefault(); draw(e.touches[0]); };
  canvas.ontouchend = stopDraw;
}

function startDraw(e) {
  isDrawing = true;
  var rect = sigCtx.canvas.getBoundingClientRect();
  var x = (e.clientX || e.pageX) - rect.left;
  var y = (e.clientY || e.pageY) - rect.top;
  sigCtx.beginPath();
  sigCtx.moveTo(x, y);
}

function draw(e) {
  if (!isDrawing) return;
  var rect = sigCtx.canvas.getBoundingClientRect();
  var x = (e.clientX || e.pageX) - rect.left;
  var y = (e.clientY || e.pageY) - rect.top;
  sigCtx.lineTo(x, y);
  sigCtx.stroke();
}

function stopDraw() {
  isDrawing = false;
}

function clearSigCanvas() {
  var canvas = document.getElementById('sigCanvas');
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveSigCanvas() {
  var canvas = document.getElementById('sigCanvas');
  // 检查是否有内容
  var dataUrl = canvas.toDataURL('image/png');
  
  var elev = getCurrentElevator();
  if (!elev) return;
  if (!elev.signatures) elev.signatures = {};
  elev.signatures[currentSigField] = dataUrl;
  saveCurrentProject();
  closeSigModal();
  renderElevatorContent();
  showToast('签名已保存');
}

  var elev = getCurrentElevator();
  if (!elev || !elev.signatures) return;
  elev.signatures[field] = '';
  saveCurrentProject();
  renderElevatorContent();
}

  html += '<div class="section-title">井道结构四面墙（手填）</div>';
  html += '<table class="print-table">';
  html += '<tr><th style="width:25%;">前墙</th><th style="width:25%;">后墙</th><th style="width:25%;">左墙</th><th style="width:25%;">右墙</th></tr>';
  html += '<tr><td style="height:40px;"></td><td></td><td></td><td></td></tr>';
  html += '</table>';
  
  // 机房参数
  html += '<div class="section-title">机房参数</div>';
  html += '<table class="print-table">';
  html += '<tr>';
  html += '<th class="label-cell">有机房/无机房</th><td class="value-cell">' + escapeHtml(elev.hasMachineRoom || '') + '</td>';
  html += '<th class="label-cell">圈梁规格</th><td class="value-cell">' + escapeHtml(elev.ringBeamSpec || '') + '</td>';
  html += '</tr>';
  if (elev.hasMachineRoom === '有') {
    html += '<tr>';
    html += '<th class="label-cell">机房宽(mm)</th><td class="value-cell">' + escapeHtml(elev.roomWidth || '') + '</td>';
    html += '<th class="label-cell">机房深(mm)</th><td class="value-cell">' + escapeHtml(elev.roomDepth || '') + '</td>';
    html += '</tr>';
    html += '<tr>';
    html += '<th class="label-cell">机房高(mm)</th><td class="value-cell">' + escapeHtml(elev.roomHeight || '') + '</td>';
    html += '<th class="label-cell">门头梁高/长(mm)</th><td class="value-cell">' + escapeHtml(elev.headerBeamHeight || '') + ' / ' + escapeHtml(elev.headerBeamLength || '') + '</td>';
    html += '</tr>';
  }
  html += '<tr>';
  html += '<th class="label-cell">动力电源</th><td class="value-cell">________ V</td>';
  html += '<th class="label-cell">照明电源</th><td class="value-cell">________ V</td>';
  html += '</tr>';
  html += '</table>';
  
  // 示意图区域
  html += '<div class="section-title">示意图</div>';
  html += '<div class="sketch-section">';
  if (elev.sketches && elev.sketches.length) {
    html += '<div class="sketch-grid">';
    var displayCount = Math.min(elev.sketches.length, 4);
    for (var s = 0; s < displayCount; s++) {
      html += '<div class="sketch-item"><img src="' + elev.sketches[s].data + '"></div>';
    }
    for (var s = displayCount; s < 4; s++) {
      html += '<div class="sketch-item" style="color:#aaa;font-size:9pt;">示意图 ' + (s+1) + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="sketch-grid">';
    for (var s2 = 0; s2 < 4; s2++) {
      html += '<div class="sketch-item" style="color:#aaa;font-size:9pt;">示意图 ' + (s2+1) + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  
  // 特殊说明
  html += '<div class="section-title">特殊说明</div>';
  html += '<div class="notes-area">' + escapeHtml(elev.specialNotes || '') + '&nbsp;</div>';
  
  // 签字区域
  html += '<div class="sig-row">';
  html += '<div class="sig-item">';
  html += '<div class="sig-label">测量及申请人：</div>';
  html += '<div class="sig-box">';
  if (sigs.surveyor) html += '<img src="' + sigs.surveyor + '">';
  html += '</div>';
  html += '</div>';
  html += '<div class="sig-item">';
  html += '<div class="sig-label">审核：</div>';
  html += '<div class="sig-box">';
  if (sigs.reviewer) html += '<img src="' + sigs.reviewer + '">';
  html += '</div>';
  html += '</div>';
  html += '<div class="sig-item">';
  html += '<div class="sig-label">绘图接收人：</div>';
  html += '<div class="sig-box">';
  if (sigs.draftsman) html += '<img src="' + sigs.draftsman + '">';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  
  html += '<div style="text-align:right;margin-top:20px;font-size:9pt;color:#666;">测量日期：' + formatDate(new Date()) + '</div>';
  
  html += '</div>'; // print-page
  
  printArea.innerHTML = html;
}

function formatDate(d) {
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
  loadAllProjects(function() {
    // 如果有项目，默认选中第一个
    if (projects.length > 0) {
      // 不自动选中，显示空状态
    }
    renderEmptyOrContent();
  });
});

// 点击模态框外部关闭
document.querySelectorAll('.modal-mask').forEach(function(mask) {
  mask.addEventListener('click', function(e) {
    if (e.target === mask) {
      mask.classList.remove('show');
    }
  });
});
</script>
