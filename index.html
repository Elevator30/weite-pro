<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="威特电梯">
<link rel="apple-touch-icon" href="weite-logo.png">
<link rel="icon" type="image/png" href="weite-logo.png">
<title>威特电梯</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f7fa;
  min-height: 100vh;
  color: #333;
}
.hero {
  background: #fff;
  padding: 60px 20px 40px;
  text-align: center;
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.hero img {
  width: 120px;
  height: auto;
  margin-bottom: 12px;
}
.hero h1 {
  font-size: 24px;
  font-weight: 600;
  color: #1a237e;
  letter-spacing: 4px;
  margin-bottom: 6px;
}
.hero p {
  font-size: 13px;
  color: #999;
}
.card-list {
  max-width: 480px;
  margin: 30px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card {
  background: #fff;
  border-radius: 14px;
  padding: 22px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card:active {
  transform: scale(0.98);
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.card-icon {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.card-icon.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
.card-icon.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
.card-icon.orange { background: linear-gradient(135deg, #f093fb, #f5576c); }
.card-body { flex: 1; }
.card-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 3px;
  color: #1a1a2e;
}
.card-desc {
  font-size: 13px;
  color: #888;
}
.card-arrow {
  font-size: 20px;
  color: #ccc;
  flex-shrink: 0;
  font-weight: 300;
}
.footer {
  text-align: center;
  margin-top: 40px;
  padding-bottom: 30px;
  color: #bbb;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="hero">
  <img src="weite-logo.png" alt="威特电梯">
  <h1>威特电梯</h1>
  <p>技术服务工作台</p>
</div>

<div class="card-list">
  <a href="weite-service-v14.html" class="card">
    <div class="card-icon blue">🛠️</div>
    <div class="card-body">
      <div class="card-title">威特技术服务</div>
      <div class="card-desc">电梯技术服务单管理</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

  <a href="factory-inspection-v2.html" class="card">
    <div class="card-icon green">📋</div>
    <div class="card-body">
      <div class="card-title">厂检调试记录</div>
      <div class="card-desc">厂检调试记录单 V2</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

  <a href="travel-expense.html" class="card">
    <div class="card-icon orange">💰</div>
    <div class="card-body">
      <div class="card-title">差旅费报销助手</div>
      <div class="card-desc">差旅费用记录与报销</div>
    </div>
    <div class="card-arrow">›</div>
  </a>
</div>

<div class="footer">
  威特电梯技术服务 · v1.0
</div>

</body>
</html>
