<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="威特电梯">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="touch-icon.png">
<link rel="icon" type="image/png" href="touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>威特电梯</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f7fa;
  color: #333;
}
body {
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
}

/* 首页视图 */
.home-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.hero {
  background: #fff;
  padding: 40px 20px 30px;
  text-align: center;
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  flex-shrink: 0;
}
.hero img {
  height: 50px;
  width: auto;
  margin-bottom: 12px;
}
.hero h1 {
  font-size: 24px;
  font-weight: 600;
  color: #1a237e;
  letter-spacing: 4px;
  margin-bottom: 6px;
}
.hero p {
  font-size: 13px;
  color: #999;
}
.card-list {
  max-width: 480px;
  width: 100%;
  margin: 30px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}
.card {
  background: #fff;
  border-radius: 14px;
  padding: 22px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}
.card:active {
  transform: scale(0.98);
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.card-icon {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.card-icon.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
.card-icon.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
.card-icon.orange { background: linear-gradient(135deg, #f093fb, #f5576c); }
.card-body { flex: 1; }
.card-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 3px;
  color: #1a1a2e;
}
.card-desc {
  font-size: 13px;
  color: #888;
}
.card-arrow {
  font-size: 20px;
  color: #ccc;
  flex-shrink: 0;
  font-weight: 300;
}
.footer {
  text-align: center;
  margin-top: auto;
  padding: 30px 20px;
  color: #bbb;
  font-size: 12px;
  flex-shrink: 0;
}

/* 子页面视图 */
.app-view {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
.app-bar {
  height: 44px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid #eee;
  flex-shrink: 0;
  position: relative;
}
.back-btn {
  font-size: 15px;
  color: #667eea;
  padding: 8px 12px;
  text-decoration: none;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.back-btn:active { opacity: 0.6; }
.back-btn::before {
  content: '';
  display: inline-block;
  width: 10px;
  height: 10px;
  border-left: 2px solid #667eea;
  border-bottom: 2px solid #667eea;
  transform: rotate(45deg);
  margin-right: 2px;
}
.app-title {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 16px;
  font-weight: 600;
  color: #333;
  pointer-events: none;
}
.app-iframe {
  flex: 1;
  width: 100%;
  border: none;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
</style>
</head>

<!-- 子页面视图 -->
<div class="app-view" id="appView">
  <div class="app-bar">
    <div class="back-btn" onclick="goHome()">返回</div>
    <div class="app-title" id="appTitle"></div>
  </div>
  <iframe class="app-iframe" id="appIframe" src=""></iframe>
</div>

<script>
function openApp(url, title) {
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('appView').style.display = 'flex';
  document.getElementById('appTitle').textContent = title;
  // 加随机参数绕过缓存
  var v = 'v=' + Date.now();
  document.getElementById('appIframe').src = url + (url.indexOf('?') > -1 ? '&' : '?') + v;
}

function goHome() {
  document.getElementById('appView').style.display = 'none';
  document.getElementById('appIframe').src = '';
  document.getElementById('homeView').style.display = 'flex';
}
</script>
