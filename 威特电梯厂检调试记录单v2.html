<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','微软雅黑',sans-serif;background:#f5f7fa;padding-bottom:20px;-webkit-overflow-scrolling:touch;}
.page{display:none;overflow:visible;}
.page.active{display:block;}
/* Header */
.header{padding:10px 16px 8px;background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid #edf2f7;-webkit-backface-visibility:hidden;will-change:transform;}
.logo-area{display:flex;align-items:flex-end;gap:0;}
.logo-img{height:32px;width:auto;}
.logo-elev{font-size:18px;font-weight:900;color:#0d2137;letter-spacing:0px;font-family:'PingFang SC','Heiti SC',sans-serif;line-height:1;}
.header-sub{font-size:12px;color:#555;letter-spacing:3px;margin-top:3px;font-family:'Songti SC','SimSun',serif;}
.logo-weite{font-size:24px;font-weight:900;color:#1a3a6b;letter-spacing:2px;}
/* Progress */
.progress-container{padding:10px 16px 8px;background:#fff;position:sticky;top:50px;z-index:49;-webkit-backface-visibility:hidden;will-change:transform;}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.progress-title{font-size:12px;font-weight:600;color:#718096;}
.progress-percent{font-size:14px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.progress-bar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .3s;}
/* Task card */
.task-list{padding:12px;}
.task-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1.5px solid #e2e8f0;cursor:pointer;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.task-card:active{transform:scale(.98);}
.task-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.task-prod{font-size:15px;font-weight:700;color:#2d3748;}
.task-date{font-size:10px;color:#a0aec0;}
.task-name{font-size:13px;color:#4a5568;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-meta{font-size:11px;color:#718096;margin-bottom:8px;}
.task-prog{margin-bottom:8px;}
.task-prog-h{display:flex;justify-content:space-between;font-size:10px;color:#718096;margin-bottom:3px;}
.task-prog-b{height:4px;background:#edf2f7;border-radius:2px;overflow:hidden;}
.task-prog-f{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .3s;}
.task-btns{display:flex;gap:8px;}
.task-btns button{flex:1;padding:8px 0;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-view{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn-del{background:#fff5f5;color:#c0392b;border:1.5px solid #fed7d7!important;}
/* Region card grid */
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px;}
.region-card{background:#fff;border-radius:14px;padding:20px 16px;border:1.5px solid #e2e8f0;cursor:pointer;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .15s;}
.region-card:active{transform:scale(.97);}
.region-card-t{font-size:15px;font-weight:700;margin-bottom:8px;}
.region-card-n{font-size:14px;color:#2d3748;font-weight:600;}
.region-card-s{position:absolute;top:12px;right:12px;background:#edf2f7;color:#718096;font-weight:600;padding:3px 10px;border-radius:10px;font-size:11px;}
.region-card-s.done{background:#d4edda;color:#155724;}
.region-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e0;position:absolute;top:12px;right:12px;}
.region-dot.done{background:#68d391;}
/* Bottom bar */
.btm{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;}
.btm .btn-pri{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;padding:14px 0;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(102,126,234,.3);}
.btm .btn-pri:active{transform:translateY(1px);}
.btm .btn-sec{background:#f7fafc;color:#718096;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 0;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;}
.btm .btn-sec:active{background:#edf2f7;}
/* Modal */
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;}
.mi{position:absolute;top:0;width:100%;max-height:90vh;background:#fff;border-radius:0 0 16px 16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s;}
.mi.show{display:flex;}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#667eea,#764ba2);flex-shrink:0;}
.mh h3{font-size:15px;color:#fff;font-weight:600;}
.mh button{background:none;border:none;font-size:24px;cursor:pointer;color:#fff;line-height:1;}
.mb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px;max-height:calc(90vh - 60px);}
.mc{flex-shrink:0;padding:10px 14px;background:#fff;border-top:1px solid #eee;display:flex;gap:10px;}
.mc button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
.mc .mc-cancel{background:#f7fafc;color:#718096;border:1.5px solid #e2e8f0;}
.mc .mc-confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
/* Check item row */
.ci-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f4f8;gap:8px;}
.ci-row:last-child{border-bottom:none;}
.ci-num{font-size:11px;color:#a0aec0;width:28px;text-align:center;flex-shrink:0;}
.ci-content{flex:1;min-width:0;}
.ci-name{font-size:13px;color:#2d3748;margin-bottom:2px;word-break:break-all;}
.ci-std{font-size:11px;color:#718096;}
.ci-value{flex-shrink:0;}
.ci-value input{width:60px;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:13px;text-align:center;}
.ci-btn{width:44px;height:36px;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .15s;flex-shrink:0;}
.ci-btn.ok{background:#d4edda;color:#155724;border-color:#28a745;}
.ci-btn.ng{background:#f8d7da;color:#721c24;border-color:#dc3545;}
.ci-btn.na{background:#e2e8f0;color:#6c757d;border-color:#adb5bd;}
/* Form fields */
.fr{display:flex;align-items:center;margin-bottom:12px;gap:8px;}
.fr label{min-width:80px;font-size:13px;color:#333;flex-shrink:0;}
.fr input,.fr select{flex:1;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:14px;background:#fafafa;}
.fr input:focus,.fr select:focus{border-color:#667eea;background:#fff;outline:none;}
.fr textarea{flex:1;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:14px;background:#fafafa;min-height:60px;resize:vertical;}
/* Attachment tabs */
.att-tabs{display:flex;gap:6px;padding:10px 12px;background:#f8fafc;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.att-tab{padding:8px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;white-space:nowrap;font-size:12px;font-weight:600;color:#4a5568;cursor:pointer;}
.att-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;}
.att-content{padding:12px;}
/* Attachment cards */
.att-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1.5px solid #e2e8f0;}
.att-card-title{font-size:13px;font-weight:700;color:#fff;padding:8px 12px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:8px 8px 0 0;margin:-14px -14px 12px;}
.att-row{display:flex;align-items:center;margin-bottom:10px;gap:8px;}
.att-row label{flex:1;font-size:12px;color:#4a5568;min-width:0;}
.att-row input,.att-row select{flex:none;width:80px;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:13px;text-align:center;}
.att-row .warn{color:#dc3545;font-weight:600;}
.att-row .ok{color:#28a745;font-weight:600;}
/* Door type toggle */
.door-toggle{display:flex;gap:8px;margin-bottom:12px;}
.door-toggle-btn{flex:1;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#718096;}
.door-toggle-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;}
/* Floor row */
.att-floor-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.att-floor-row input{width:80px;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:12px;text-align:center;}
.att-floor-del{background:#fff5f5;color:#dc3545;border:none;border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;}
.att-plus{background:#f0fff4;color:#28a745;border:1px dashed #28a745;border-radius:6px;padding:8px;text-align:center;font-size:13px;cursor:pointer;margin-top:8px;}
/* NG Modal */
.ng-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1999;display:none;align-items:center;justify-content:center;padding:20px;}
.ng-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:360px;}
.ng-title{font-size:16px;font-weight:700;color:#dc3545;margin-bottom:16px;}
.ng-row{margin-bottom:12px;}
.ng-row label{display:block;font-size:12px;color:#666;margin-bottom:4px;}
.ng-row textarea,.ng-row select{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:14px;}
.ng-btns{display:flex;gap:10px;margin-top:16px;}
.ng-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.ng-cancel{background:#f7fafc;color:#666;}
.ng-confirm{background:#dc3545;color:#fff;}
/* Signature */
.sig-area{border:2px dashed #ddd;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;margin-top:8px;}
.sig-area:active{background:#f0f4f8;}
.sig-area img{max-height:75px;max-width:95%;}
.sig-area span{font-size:12px;color:#aaa;}
.sig-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2999;display:none;align-items:center;justify-content:center;}
.sig-canvas{border:1px solid #ddd;background:#fff;width:95%;max-width:800px;border-radius:12px;overflow:hidden;}
.sig-canvas-h{background:#667eea;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.sig-canvas-h button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.sig-canvas-c{background:#fff;height:300px;touch-action:none;padding:10px;}
.sig-canvas-c canvas{width:100%;height:100%;display:block;border:2px solid #ddd;border-radius:8px;}
.sig-canvas-f{display:flex;gap:10px;padding:12px;background:#fff;}
.sig-canvas-f button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.sig-clear{background:#f7fafc;color:#666;}
.sig-save{background:#667eea;color:#fff;}
/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;display:none;}
/* Print area */
.print-area{display:none;}
.print-page-landscape{width:277mm;min-height:190mm;page-break-before:always;box-sizing:border-box;padding:6mm 8mm;}
.print-page-landscape:first-child{page-break-before:auto;}
/* Notice */
.notice-section{margin-top:20px;}
.notice-item{background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:12px;margin-bottom:10px;}
.notice-item-header{display:flex;justify-content:space-between;margin-bottom:8px;}
.notice-seq{color:#dc3545;font-weight:700;}
.notice-duty{color:#666;font-size:12px;}
.notice-content{font-size:13px;color:#333;}
.notice-std{font-size:11px;color:#666;margin-top:4px;}
/* Hide on print */
@media print{.no-print{display:none!important;}}
/* Config mapping badge */
.config-badge{display:inline-block;background:#e6f3ff;border:1px solid #91caff;border-radius:4px;padding:1px 6px;font-size:10px;color:#1677ff;margin-left:4px;}
/* Balance calc row */
.calc-row{display:flex;align-items:center;gap:8px;padding:8px;background:#f0f4f8;border-radius:6px;margin-bottom:8px;}
.calc-row label{flex:0 0 100px;font-size:12px;color:#666;}
.calc-row input{flex:1;border:1px solid #ddd;border-radius:4px;padding:6px;font-size:12px;text-align:center;}
/* Auto-judge result */
.auto-result{padding:8px 12px;background:#fff3f0;border:1px solid #ffccc7;border-radius:6px;font-size:12px;margin-top:8px;}
.auto-result.pass{background:#f6ffed;border-color:#b7eb8f;}

/* Zone tabs - horizontal scrolling */
.zone-tabs{display:flex;gap:0;padding:0 12px;background:#fff;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;border-bottom:2px solid #edf2f7;position:sticky;top:90px;z-index:48;}
.zone-tab{padding:10px 16px;white-space:nowrap;font-size:13px;font-weight:600;color:#718096;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;flex-shrink:0;}
.zone-tab.active{color:#667eea;border-bottom-color:#667eea;}
.zone-tab.done{color:#38a169;}
.zone-tab.active.done{color:#667eea;border-bottom-color:#667eea;}
/* Zone content area */
.zone-content{padding:12px 12px 80px;min-height:40vh;}
/* Sub-group header */
.sub-header{font-size:13px;font-weight:700;color:#fff;padding:8px 12px;margin:12px -12px 0;border-radius:8px 8px 0 0;}
.sub-header:first-child{margin-top:0;}
/* Check row new layout */
.ck-row{background:#fff;border:1px solid #e8ecf0;border-radius:10px;padding:12px;margin-bottom:8px;transition:all .15s;}
.ck-row.ng-row{border-color:#ffcdd2;background:#fff8f8;}
.ck-row-top{display:flex;align-items:flex-start;gap:8px;}
.ck-num{font-size:11px;color:#a0aec0;min-width:24px;flex-shrink:0;padding-top:3px;}
.ck-body{flex:1;min-width:0;}
.ck-name{font-size:13px;color:#2d3748;margin-bottom:4px;word-break:break-all;}
.ck-std{font-size:11px;color:#718096;margin-bottom:6px;}
.ck-badge{display:inline-block;background:#e6f3ff;border:1px solid #91caff;border-radius:4px;padding:1px 6px;font-size:10px;color:#1677ff;margin-left:4px;}
/* Radio group - 3 choices */
.radio-group{display:flex;gap:6px;margin-top:4px;}
.radio-btn{flex:1;padding:8px 0;border:1.5px solid #e2e8f0;border-radius:8px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:#fff;transition:all .12s;color:#718096;}
.radio-btn:active{transform:scale(.96);}
.radio-btn.r-ok{border-color:#28a745;background:#d4edda;color:#155724;}
.radio-btn.r-ng{border-color:#dc3545;background:#f8d7da;color:#721c24;}
.radio-btn.r-na{border-color:#adb5bd;background:#e2e8f0;color:#6c757d;}
/* Input value in row */
.ck-value{display:flex;align-items:center;gap:6px;margin-top:6px;}
.ck-value label{font-size:11px;color:#718096;white-space:nowrap;}
.ck-value input{flex:1;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:13px;text-align:center;max-width:100px;}
/* NG expand section */
.ng-expand{margin-top:8px;padding:10px;background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;}
.ng-expand .ng-field{margin-bottom:8px;}
.ng-expand .ng-field:last-child{margin-bottom:0;}
.ng-expand .ng-field label{display:block;font-size:11px;color:#666;margin-bottom:3px;}
.ng-expand select,.ng-expand textarea{width:100%;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:13px;box-sizing:border-box;}
.ng-expand textarea{min-height:50px;resize:vertical;}
/* Photo upload */
.ng-photo-area{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.ng-photo-thumb{width:60px;height:60px;border-radius:6px;overflow:hidden;position:relative;border:1px solid #eee;}
.ng-photo-thumb img{width:100%;height:100%;object-fit:cover;}
.ng-photo-del{position:absolute;top:0;right:0;background:rgba(220,53,69,.8);color:#fff;border:none;border-radius:0 6px 0 6px;font-size:12px;cursor:pointer;padding:2px 6px;line-height:1;}
.ng-photo-add{width:60px;height:60px;border:1.5px dashed #ccc;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:#aaa;background:#fafafa;}
/* Bottom navigation */
.btm-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:10px 12px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;}
.btm-nav button{padding:12px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}

.btm-sign{background:#f7fafc;color:#718096;border:1.5px solid #e2e8f0!important;}
.btm-prev{background:#f7fafc;color:#718096;border:1.5px solid #e2e8f0!important;}
.btm-save{background:linear-gradient(135deg,#38a169,#48bb78);color:#fff;}
.btm-next{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btm-prev:active,.btm-next:active,.btm-save:active{transform:translateY(1px);}
/* Extra buttons row above bottom nav */
.btm-extra{position:fixed;bottom:56px;left:0;right:0;display:flex;gap:8px;padding:6px 16px;background:#f7fafc;z-index:99;}
.btm-extra button{flex:1;padding:8px 0;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:12px;color:#718096;cursor:pointer;}


/* Header menu button */
.header-menu-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#f0f4f8;border:1.5px solid #cbd5e0;border-radius:6px;font-size:20px;color:#1a3a6b;cursor:pointer;padding:4px 8px;z-index:60;line-height:1;}
.header-dropdown{position:absolute;top:100%;right:0;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;z-index:200;min-width:150px;overflow:hidden;}
.header-dropdown.show{display:block;}
.header-dropdown div{padding:12px 16px;font-size:14px;color:#333;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.header-dropdown div:last-child{border-bottom:none;}
.header-dropdown div:hover{background:#f7fafc;}
/* Sub-accordion styles */
.sub-accordion{margin-bottom:10px;border-radius:12px;background:#fff;border:1px solid #e8ecf0;}
.sub-header-sticky{font-size:15px;font-weight:700;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;position:sticky;top:130px;z-index:10;transition:background .15s;border-radius:12px 12px 0 0;}
.sub-header-sticky:hover{filter:brightness(1.05);}
.sub-header-sticky .sub-title{display:flex;align-items:center;gap:8px;}
.sub-header-sticky .sub-arrow{font-size:14px;transition:transform .2s;}
.sub-header-sticky .sub-badge{margin-left:auto;margin-right:10px;font-size:12px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.25);}
.sub-header-sticky .sub-badge.done{background:#28a745;}
.sub-body{padding:10px 14px 14px;}
</style>

// ============ INIT ============
function init() {
  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored) tasks = JSON.parse(stored);
  renderTaskList();
}

function goPage(pageName) {
  // 关闭所有菜单
  document.querySelectorAll('.header-dropdown').forEach(function(d){d.classList.remove('show');});
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-' + pageName).classList.add('active');
  if (pageName === 'main') renderTaskList();
  window.scrollTo(0, 0);
}

// ============ TASK LIST ============
function renderTaskList() {
  var container = document.getElementById('taskList');
  if (tasks.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#a0aec0;"><div style="font-size:48px;margin-bottom:12px;">📋</div><div style="font-size:14px;">暂无检查记录</div><div style="font-size:12px;margin-top:8px;">点击右上角菜单新建检查</div></div>';
    return;
  }
  var html = '';
  tasks.forEach(function(task, i) {
    var total = checkItems.length;
    var done = Object.keys(task.checks || {}).filter(function(id) {
      var c = task.checks[id];
      return c && (c.s === 'ok' || c.s === 'ng' || c.s === 'na');
    }).length;
    var pct = total > 0 ? Math.round(done/total*100) : 0;
    var date = task.checkDate || (new Date(task.id)).toLocaleDateString('zh-CN');
    html += '<div class="task-card" onclick="openTask(' + i + ')">' +
      '<div class="task-card-top">' +
        '<span class="task-prod">' + (task.prodNo||'未编号') + '</span>' +
        '<span class="task-date">' + date + '</span>' +
      '</div>' +
      '<div class="task-name">' + (task.addr||'未命名项目') + '</div>' +
      '<div class="task-meta">' + (task.model||'') + '</div>' +
      '<div class="task-prog">' +
        '<div class="task-prog-h"><span>检验进度</span><span>' + done + '/' + total + '</span></div>' +
        '<div class="task-prog-b"><div class="task-prog-f" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="task-btns"><button class="btn-view" onclick="event.stopPropagation();openTask(' + i + ')">查看</button><button class="btn-del" onclick="event.stopPropagation();deleteTask(' + i + ')">删除</button></div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function openTask(index) {
  currentTaskIndex = index;
  var task = tasks[index];
  // 恢复配置单数据
  if (task.configParts) {
    configPartsData = task.configParts;
  }
  document.getElementById('checkProdNo').textContent = task.prodNo || '未编号';
  document.getElementById('checkHeaderSub').textContent = (task.model || '厂检调试记录单V2');
  goPage('check');
  renderZoneTabs();
  switchZone(0);
  updateProgress();
}

function deleteTask(index) {
  if (!confirm('确认删除此检查记录？')) return;
  tasks.splice(index, 1);
  saveTasks();
  renderTaskList();
}

      attach3: {rows:[{carL:'',carR:'',weightL:'',weightR:''}], maxDev:{carL:'',carR:'',weightL:'',weightR:''}},

// ============ CONFIG UPLOAD (from v1) ============
function handleConfigUpload(input) {
  var file = input.files[0];
  if (!file) return;
  
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var json = XLSX.utils.sheet_to_json(ws, {header:1});
      
      // 用坐标函数读取单元格
      var val = function(r,c){ var cell = ws[XLSX.utils.encode_cell({r:r,c:c})]; return cell ? String(cell.v).trim() : ''; };
      
      configPartsData = {};
      var prodNo = '', addr = '', modelPrefix = '', loadWeight = '', speed = '';
      
      // === 1. 提取基本信息（前4行） ===
      for (var r = 0; r < 5; r++) {
        for (var c = 0; c < 15; c++) {
          var cv = val(r, c);
          if (!cv) continue;
          // "标签：值"在同一单元格
          if (cv.indexOf('：') > 0) {
            var ci = cv.indexOf('：');
            var label = cv.substring(0, ci).trim();
            var value = cv.substring(ci + 1).trim();
            if (label === '产品编号' && !prodNo) prodNo = value;
            if (label === '项目名称' && !addr) addr = value;
          }
          // "标签：值"在不同单元格
          if (cv === '产品编号' && !prodNo) prodNo = val(r, c+1) || val(r, c+2);
          if (cv === '项目名称' && !addr) addr = val(r, c+1) || val(r, c+2);
          // 产品型号前缀（如TKJ/TKJW）- 检查多个可能的位置
          if ((cv === '产品型号' || cv === '型号') && !modelPrefix) {
            modelPrefix = val(r, c+1) || val(r, c+2) || val(r+1, c) || val(r+1, c+1);
            // 如果提取到的是中文描述而不是型号前缀，跳过
            if (modelPrefix && /[\u4e00-\u9fa5]/.test(modelPrefix)) {
              modelPrefix = '';
            }
          }
        }
      }
      
      // === 2. 提取额定载重量和额定速度 ===
      // 配置单布局：第5行是表头，第7行是数据
      // 扩大搜索范围，同时搜索前10行和后10列
      var loadCol = -1, speedCol = -1, headerRow = -1;
      for (var r2 = 0; r2 < 15; r2++) {
        for (var c2 = 0; c2 < 20; c2++) {
          var cv2 = val(r2, c2);
          if (cv2 === '额定载重量' || cv2 === '额定载荷') { loadCol = c2; headerRow = r2; }
          if (cv2 === '额定速度') { speedCol = c2; if (headerRow < 0) headerRow = r2; }
        }
      }
      // 如果没找到表头，尝试其他方式提取载重和速度
      if (loadCol < 0) {
        for (var r3 = 0; r3 < 15; r3++) {
          for (var c3 = 0; c3 < 20; c3++) {
            var cv3 = val(r3, c3);
            // 查找包含数字+kg的单元格
            if (cv3 && /\d+\s*kg/i.test(cv3)) {
              loadWeight = cv3.replace(/[kK][gG]/gi, '').replace(/公斤/g, '').replace(/kg/gi, '').trim();
              if (loadWeight && !isNaN(parseFloat(loadWeight))) break;
            }
            // 查找包含数字+m/s的单元格
            if (cv3 && (/\d+\s*m\/s/i.test(cv3) || /\d+\s*米\/秒/i.test(cv3))) {
              speed = cv3.replace(/[mM]\/[sS]/gi, '').replace(/米\/秒/g, '').replace(/m\/s/gi, '').trim();
              if (speed && !isNaN(parseFloat(speed))) break;
            }
          }
          if (loadWeight && speed) break;
        }
      } else {
        // 从表头下面找数据行（跳过合并行，最多往下找10行）
        for (var dr = 1; dr <= 10; dr++) {
          if (loadCol >= 0 && !loadWeight) {
            var lv = val(headerRow + dr, loadCol);
            if (lv && /\d/.test(lv)) {
              loadWeight = lv.replace(/[kK][gG]/g, '').replace(/公斤/g, '').trim();
            }
          }
          if (speedCol >= 0 && !speed) {
            var sv = val(headerRow + dr, speedCol);
            if (sv && /\d/.test(sv)) {
              speed = sv.replace(/[mM]\/[sS]/g, '').replace(/米\/秒/g, '').replace(/m\/s/gi, '').trim();
            }
          }
          if (loadWeight && speed) break;
        }
      }
      
      // 保存载重和速度到configPartsData
      configPartsData['额定载重量'] = loadWeight;
      configPartsData['额定速度'] = speed;
      
      // === 3. 拼接产品型号 ===
      var model = '';
      if (modelPrefix) {
        model = modelPrefix;
      }
      if (loadWeight) {
        model += loadWeight;
      }
      if (speed) {
        model += '/' + speed;
      }
      if (model.indexOf('JXW') < 0 && model.indexOf('VVVF') < 0) {
        model += '-JXW-VVVF';
      } else if (model && !model.endsWith('-JXW-VVVF') && !model.endsWith('VVVF')) {
        // 如果型号中已有内容但没有后缀，添加后缀
        if (!/-JXW|-VVVF/.test(model)) {
          model += '-JXW-VVVF';
        }
      }
      
      // === 4. 解析主要部件表格 ===
      // 部件表结构：产品名称[A列]、型号[C列]、编号[E列]
      var partStartRow = -1;
      for (var r3 = 0; r3 < json.length; r3++) {
        var rowStr = JSON.stringify(json[r3] || []);
        if (rowStr.indexOf('产品名称') >= 0 && rowStr.indexOf('型号') >= 0) {
          partStartRow = r3 + 1; // 表头下一行开始是数据
          break;
        }
      }
      if (partStartRow > 0) {
        for (var r4 = partStartRow; r4 < Math.min(partStartRow + 20, json.length); r4++) {
          var partName = String(json[r4] ? (json[r4][0] || '') : '').trim();
          var partModel = String(json[r4] ? (json[r4][2] || '') : '').trim(); // C列=型号
          var partCode = String(json[r4] ? (json[r4][4] || '') : '').trim();  // E列=编号
          if (!partName || partName.indexOf('二、') >= 0 || partName.indexOf('三、') >= 0) break;
          // 存入configPartsData
          if (partName.indexOf('乘客电梯') >= 0 || (partName.indexOf('曳引') >= 0 && partName.indexOf('驱动主机') < 0 && partName.indexOf('曳引机') < 0)) {
            configPartsData['整梯_型号'] = partModel;
            configPartsData['整梯_编号'] = partCode;
            // 整梯编号=控制柜编号，后续匹配控制柜行时会自动填充控制柜型号
          } else if (partName.indexOf('控制柜') >= 0) {
            configPartsData['控制柜_型号'] = partModel;
            configPartsData['控制柜_编号'] = partCode;
          } else if (partName.indexOf('驱动主机') >= 0 || partName.indexOf('主机') >= 0 || partName.indexOf('曳引机') >= 0) {
            configPartsData['驱动主机_型号'] = partModel;
            configPartsData['驱动主机_编号'] = partCode;
          } else if (partName.indexOf('上行超速') >= 0) {
            configPartsData['上行超速_型号'] = partModel;
            configPartsData['上行超速_编号'] = partCode;
          } else if (partName.indexOf('意外移动') >= 0) {
            configPartsData['意外移动_型号'] = partModel;
            configPartsData['意外移动_编号'] = partCode;
          } else if (partName.indexOf('限速器') >= 0) {
            configPartsData['限速器_型号'] = partModel;
            configPartsData['限速器_编号'] = partCode;
          } else if (partName.indexOf('安全钳') >= 0) {
            configPartsData['安全钳_型号'] = partModel;
            configPartsData['安全钳_编号'] = partCode;
          } else if (partName.indexOf('缓冲器') >= 0) {
            configPartsData['缓冲器_型号'] = partModel;
            configPartsData['缓冲器_编号'] = partCode;
          } else if (partName.indexOf('层门门锁') >= 0 || partName.indexOf('层门锁') >= 0) {
            configPartsData['层门锁_型号'] = partModel;
            configPartsData['层门锁_编号'] = partCode;
          } else if (partName.indexOf('轿门门锁') >= 0 || partName.indexOf('轿门锁') >= 0) {
            configPartsData['轿门锁_型号'] = partModel;
            configPartsData['轿门锁_编号'] = partCode;
          } else if (partName.indexOf('层门') >= 0 && partName.indexOf('门锁') < 0) {
            configPartsData['层门_型号'] = partModel;
            configPartsData['层门_编号'] = partCode;
          } else if (partName.indexOf('安全电路') >= 0) {
            configPartsData['安全电路_型号'] = partModel;
            configPartsData['安全电路_编号'] = partCode;
          }
        }
      }
      
      // === 5. 产品编号唯一性检查 ===
      if (prodNo) {
        for (var i = 0; i < tasks.length; i++) {
          if (tasks[i].prodNo === prodNo) {
            showToast('产品编号 ' + prodNo + ' 已存在，不能重复创建！');
            document.getElementById('configFileName').textContent = '编号重复: ' + prodNo;
            return;
          }
        }
      }
      
      // === 6. 自动填充表单 ===
      if (prodNo) document.getElementById('newProdNo').value = prodNo;
      if (addr) document.getElementById('newAddr').value = addr;
      if (model) document.getElementById('newModel').value = model;
      if (loadWeight) document.getElementById('newLoad').value = loadWeight;
      if (speed) document.getElementById('newSpeed').value = speed;
      
      // 调试：显示解析到的部件名
      var debugParts = [];
      for (var r4 = partStartRow; r4 < Math.min(partStartRow + 20, json.length); r4++) {
        var pn = String(json[r4] ? (json[r4][0] || '') : '').trim();
        if (!pn || pn.indexOf('二、') >= 0 || pn.indexOf('三、') >= 0) break;
        var pm = String(json[r4] ? (json[r4][2] || '') : '').trim();
        debugParts.push(pn + (pm ? '(' + pm + ')' : ''));
      }
      console.log('[配置单] 解析到的部件:', debugParts.join(', '));
      
      document.getElementById('configFileName').textContent = '已加载: ' + file.name + (prodNo ? ' (已提取编号)' : ' (未识别编号)');
      // 同步configPartsData到当前任务
      if (currentTaskIndex >= 0 && tasks[currentTaskIndex]) {
        tasks[currentTaskIndex].configParts = JSON.parse(JSON.stringify(configPartsData));
        saveTasks();
        // 刷新当前区域显示
        renderRegionGrid();
      }
      // 如果没匹配到驱动主机，回退用整梯的型号编号（VR版等配置表结构不同时需要）
      if (!configPartsData['驱动主机_型号'] && configPartsData['整梯_型号']) {
        configPartsData['驱动主机_型号'] = configPartsData['整梯_型号'];
        configPartsData['驱动主机_编号'] = configPartsData['整梯_编号'] || '';
      }
      
      var hostInfo = configPartsData['驱动主机_型号'] ? '驱动主机: ' + configPartsData['驱动主机_型号'] : '驱动主机未识别';
      showToast('配置单已加载 | ' + hostInfo + (debugParts.length ? ' | 全部: ' + debugParts.join(', ') : ''));
    } catch(err) {
      document.getElementById('configFileName').textContent = '读取失败';
      showToast('配置单解析失败：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ============ REGION GRID ============

// ============ ZONE TAB & CONTENT (New UI) ============
function renderZoneTabs() {
  var tabs = document.getElementById('zoneTabs');
  if (!tabs) return;
  var task = tasks[currentTaskIndex];
  var html = '';
  regions.forEach(function(region, i) {
    var regionItems = checkItems.filter(function(c) { return region.ids.indexOf(c.id) !== -1; });
    var visibleItems = regionItems.filter(function(item){return hiddenCheckIds.indexOf(item.id) === -1;});
    var done = visibleItems.filter(function(item) {
      var c = task.checks[item.id];
      return c && (c.s === 'ok' || c.s === 'ng' || c.s === 'na');
    }).length;
    var isDone = visibleItems.length > 0 && done === visibleItems.length;
    var activeClass = i === currentZoneIndex ? ' active' : '';
    var doneClass = isDone ? ' done' : '';
    html += '<div class="zone-tab' + activeClass + doneClass + '" onclick="switchZone(' + i + ')">' + region.name + (isDone ? ' ✓' : '') + '</div>';
  });
  tabs.innerHTML = html;
  // Scroll active tab into view
  var activeTab = tabs.querySelector('.zone-tab.active');
  if (activeTab) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function switchZone(index) {
  if (index < 0 || index >= regions.length) return;
  currentZoneIndex = index;
  renderZoneTabs();
  renderZoneContent(index);
  updateProgress();
}

function renderZoneContent(index) {
  var container = document.getElementById('zoneContent');
  if (!container) return;
  var region = regions[index];
  var task = tasks[currentTaskIndex];
  
  // 测量数据 - show attachment tabs/content inline
  if (index === 5) {
    renderAttZoneContent(container);
    return;
  }
  // 签字确认页
  if (index === 6) {
    renderSignZoneContent(container);
    return;
  }
  
  var html = '';
  var groups = subGroupMap[index + 1];
  
  if (groups && groups.length > 1) {
    // Has sub-groups - render with accordion effect
    groups.forEach(function(grp, gi) {
      var grpItems = grp.ids.filter(function(id) { return hiddenCheckIds.indexOf(id) === -1; });
      if (grpItems.length === 0) return;
      
      // 计算完成进度
      var doneCount = grpItems.filter(function(id) {
        var c = task.checks[id];
        return c && (c.s === 'ok' || c.s === 'ng' || c.s === 'na');
      }).length;
      var isDone = doneCount === grpItems.length;
      var isExpanded = isSubGroupExpanded(index, gi);
      var arrow = isExpanded ? '▼' : '▶';
      var badgeClass = isDone ? 'done' : '';
      var badgeText = isDone ? '✓ ' + doneCount + '/' + grpItems.length : doneCount + '/' + grpItems.length;
      
      html += '<div class="sub-accordion">';
      html += '<div class="sub-header-sticky" style="background:' + region.color + ';" onclick="toggleSubGroup(' + index + ',' + gi + ')">';
      html += '<span class="sub-title">📋 ' + grp.title + '</span>';
      html += '<span class="sub-badge ' + badgeClass + '">' + badgeText + '</span>';
      html += '<span class="sub-arrow">' + arrow + '</span>';
      html += '</div>';
      html += '<div class="sub-body" style="display:' + (isExpanded ? 'block' : 'none') + ';">';
      grpItems.forEach(function(itemId) {
        html += renderCheckRow(itemId, region.color);
      });
      html += '</div></div>';
    });
    
    if (!expandedSubGroups[index]) {
      expandedSubGroups[index] = {};
    }
  } else {
    // No sub-groups or single group - render all items directly
    var regionItems = checkItems.filter(function(c) { return region.ids.indexOf(c.id) !== -1; });
    regionItems.forEach(function(item) {
      if (hiddenCheckIds.indexOf(item.id) !== -1) return;
      html += renderCheckRow(item.id, region.color);
    });
  }
  
  container.innerHTML = html;
  container.scrollTop = 0;
}

function renderCheckRow(itemId, color) {
  var item = checkItems.find(function(i){return i.id === itemId;});
  if (!item) return '';
  var task = tasks[currentTaskIndex];
  var c = task.checks[itemId] || {};
  
  // Config badge for items 1-12
  var configBadge = '';
  if (item.id >= 1 && item.id <= 12) {
    var partKey = getConfigPartKey(item);
    if (partKey && configPartsData[partKey + '_型号']) {
      var model = configPartsData[partKey + '_型号'];
      var serial = configPartsData[partKey + '_编号'] || '';
      configBadge = '<span class="ck-badge">配置:' + model + (serial ? '/' + serial : '') + '</span>';
    }
  }
  
  var ngClass = c.s === 'ng' ? ' ng-row' : '';
  var html = '<div class="ck-row' + ngClass + '" id="ckRow_' + item.id + '">';
  html += '<div class="ck-row-top">';
  html += '<div class="ck-num">' + item.id + '</div>';
  html += '<div class="ck-body">';

function addNgPhoto(itemId) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      // Compress image before storing
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var maxW = 800, maxH = 600;
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        var task = tasks[currentTaskIndex];
        if (!task.checks[itemId]) task.checks[itemId] = {};
        if (!task.checks[itemId].photos) task.checks[itemId].photos = [];
        task.checks[itemId].photos.push(dataUrl);
        saveCurrentTask();
        renderZoneContent(currentZoneIndex);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function deleteNgPhoto(itemId, photoIndex) {
  var task = tasks[currentTaskIndex];
  if (!task.checks[itemId] || !task.checks[itemId].photos) return;
  task.checks[itemId].photos.splice(photoIndex, 1);
  saveCurrentTask();
  renderZoneContent(currentZoneIndex);
}

// Touch swipe for zone switching
(function() {
  var startX = 0, startY = 0, startTime = 0;
  var zoneContent = null;
  document.addEventListener('DOMContentLoaded', function() {
    zoneContent = document.getElementById('zoneContent');
  });
  document.addEventListener('touchstart', function(e) {
    if (!zoneContent) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, {passive: true});
  document.addEventListener('touchend', function(e) {
    if (!zoneContent) return;
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - startX;
    var dy = endY - startY;
    var dt = Date.now() - startTime;
    // Only trigger if horizontal swipe > 60px, faster than 500ms, and more horizontal than vertical
    if (Math.abs(dx) > 60 && dt < 500 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      // Check we're not in a modal
      var inModal = document.querySelector('.mo[style*="display: block"], .mo[style*="display:block"], .ng-modal[style*="flex"], .sig-modal[style*="flex"]');
      if (inModal) return;
      if (dx > 0) prevZone();
      else nextZone();
    }
  }, {passive: true});
})();

function openRegionModal(index) {
  currentRegionIndex = index;
  var region = regions[index];
  var task = tasks[currentTaskIndex];
  var regionItems = checkItems.filter(function(c) { return region.ids.indexOf(c.id) !== -1; });
  
  // 测量数据大区 - 显示附表按钮列表
  if (index === 5) {
    showAttButtonsModal();
    return;
  }
  
  // 资料审查(0)和感官检查(4)不分子模块，直接显示所有检查项
  var skipSubGroup = (index === 0 || index === 4);
  
  var html = '<div class="mi show" id="miRegion">' +
    '<div class="mh" style="background:' + region.color + ';"><h3>' + region.name + '</h3><button onclick="closeRegionModal()">×</button></div>' +
    '<div class="mb" id="regionModalBody">';
  
  // 检查是否有子分组定义，且不是跳过分子模块的
  var groups = (!skipSubGroup && subGroupMap[index + 1]) ? subGroupMap[index + 1] : null;
  
  if (groups) {
    // 使用子分组渲染按钮列表
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
    groups.forEach(function(grp, gi) {
      // 过滤掉隐藏的项
      var grpItems = grp.ids.filter(function(id) { return hiddenCheckIds.indexOf(id) === -1; });
      if (grpItems.length === 0) return;
      
      var doneCount = grpItems.filter(function(id) {
        var c = task.checks[id];
        return c && (c.s === 'ok' || c.s === 'ng' || c.s === 'na');
      }).length;
      var grpPct = grpItems.length > 0 ? Math.round(doneCount / grpItems.length * 100) : 0;
      var isDone = doneCount === grpItems.length;
      
      html += '<div onclick="openSubGroupModal(' + index + ',' + gi + ')" style="padding:14px;background:' + (isDone ? '#d4edda' : '#f7fafc') + ';border-radius:10px;border:1px solid ' + (isDone ? '#28a745' : '#e2e8f0') + ';cursor:pointer;">';

function getConfigPartKey(item) {
  var name = item.name || '';
  if (name.indexOf('整梯') >= 0) return '整梯';
  if (name.indexOf('控制柜') >= 0) return '控制柜';
  if (name.indexOf('驱动主机') >= 0 || name.indexOf('主机') >= 0 || name.indexOf('曳引机') >= 0) return '驱动主机';
  if (name.indexOf('上行超速') >= 0) return '上行超速';
  if (name.indexOf('意外移动') >= 0) return '意外移动';
  if (name.indexOf('限速器') >= 0) return '限速器';
  if (name.indexOf('安全钳') >= 0) return '安全钳';
  if (name.indexOf('缓冲器') >= 0) return '缓冲器';
  if (name.indexOf('轿门门锁') >= 0 || name.indexOf('轿门锁') >= 0) return '轿门锁';
  if (name.indexOf('层门门锁') >= 0 || name.indexOf('层门锁') >= 0) return '层门锁';
  if (name === '层门' || (name.indexOf('层门') >= 0 && name.indexOf('门锁') < 0)) return '层门';
  if (name.indexOf('安全电路') >= 0) return '安全电路';
  return '';
}

        '<div class="ci-name">' + item.name + configBadge + '</div>' +
        '<div class="ci-std">标准: ' + item.std + '</div>' +
        (c.n ? '<div style="font-size:11px;color:#dc3545;margin-top:2px;">问题:' + c.n + '</div>' : '') +
      '</div>' +
      (item.isInput ? '<div class="ci-value"><input type="text" inputmode="decimal" id="val_' + item.id + '" value="' + (c.v||'') + '" placeholder="实测值" onchange="updateCheckVal(' + item.id + ',this.value)"></div>' : '') +

function toggleStatus(id) {
  var task = tasks[currentTaskIndex];
  if (!task.checks[id]) task.checks[id] = {};
  var c = task.checks[id];
  
  // Cycle: empty -> ok -> ng -> na -> empty
  if (!c.s || c.s === '') {
    c.s = 'ok';
  } else if (c.s === 'ok') {
    c.s = 'ng';
    currentNgItemId = id;
    showNgModal(id);
    return;
  } else if (c.s === 'ng') {
    c.s = 'na';
  } else {
    c.s = '';
  }
  
  updateStatusUI(id, c.s);
  saveCurrentTask();
}

function updateStatusUI(id, status) {
  var btn = document.getElementById('btn_' + id);
  if (!btn) return;
  btn.className = 'ci-btn ' + (status === 'ok' ? 'ok' : (status === 'ng' ? 'ng' : (status === 'na' ? 'na' : '')));
  btn.textContent = status === 'ok' ? '✓' : (status === 'ng' ? '✕' : (status === 'na' ? '-' : '○'));
}

function updateCheckVal(id, value) {
  var task = tasks[currentTaskIndex];
  if (!task.checks[id]) task.checks[id] = {};
  task.checks[id].v = value;
  saveCurrentTask();
}

  document.getElementById('ngModal').style.display = 'none';
  // 只在取消时才重置状态，确认时由confirmNg更新UI
  // 如果currentNgItemId还在但modal关了，说明是取消操作
  if (currentNgItemId > 0 && document.getElementById('ngDuty').value === '') {
    updateStatusUI(currentNgItemId, '');
  }
  currentNgItemId = -1;
}

function confirmNg() {
  var duty = document.getElementById('ngDuty').value;
  var desc = document.getElementById('ngDesc').value;
  if (!duty) { showToast('请选择责任方！'); return; }
  
  var task = tasks[currentTaskIndex];
  if (!task.checks[currentNgItemId]) task.checks[currentNgItemId] = {};
  task.checks[currentNgItemId].s = 'ng';
  task.checks[currentNgItemId].d = duty;
  task.checks[currentNgItemId].n = desc;
  
  updateStatusUI(currentNgItemId, 'ng');
  saveCurrentTask();
  closeNgModal();
}

  var data = [];

    var el = document.getElementById('laygate_new_' + j);

  }
  var att1 = tasks[currentTaskIndex].attachments.attach1;

  // 保持在新增模式，清空输入准备下一层

function renderAttach3Judge() {
  var task = tasks[currentTaskIndex];
  var att3 = task.attachments.attach3 || {rows:[], maxDev:{}};
  
  var hasFail = false;
  var vals = [att3.maxDev.carL, att3.maxDev.carR, att3.maxDev.weightL, att3.maxDev.weightR];
  vals.forEach(function(v) {
    if (v) {
      var maxDev = parseFloat(v) || 0;
      if (maxDev > 1.2) hasFail = true;
    }
  });
  
  if (!task.checks[140]) task.checks[140] = {};
  if (hasFail) {
    task.checks[140].s = 'ng';
    task.checks[140].n = '导轨铅垂度超1.2mm/5m';
  } else if (vals.some(function(v){return v;})) {
    task.checks[140].s = 'ok';
  }
  
  var hasData = vals.some(function(v){return v;});
  var html = '<div class="auto-result' + (!hasFail && hasData ? ' pass' : '') + '">';
  html += '<strong>自动判定:</strong> id140(导轨铅垂度) ';
  if (task.checks[140].s === 'ok') html += '<span style="color:#52c41a;">✓合格</span>';
  else if (task.checks[140].s === 'ng') html += '<span style="color:#ff4d4f;">✕不合格</span>';
  else html += '<span style="color:#999;">未判定</span>';
  html += '</div>';
  return html;
}

function calcBalanceFactor() {
  var att5 = tasks[currentTaskIndex].attachments.attach5;
  var upCurrents = att5.电流['电流上行'] || [];
  var downCurrents = att5.电流['电流下行'] || [];
  
  // 线性插值法计算平衡系数
  var upVals = upCurrents.map(function(v){return parseFloat(v);}).filter(function(v){return !isNaN(v);});
  var downVals = downCurrents.map(function(v){return parseFloat(v);}).filter(function(v){return !isNaN(v);});
  
  if (upVals.length < 2 || downVals.length < 2) {
    showToast('请至少填写2个上行和2个下行电流值');
    return;
  }
  
  var percentages = [30, 40, 45, 50, 60];
  
  // 找交叉点
  var balancePoint = 0;
  var found = false;
  
  for (var i = 0; i < upVals.length - 1; i++) {
    var x1 = percentages[i];
    var x2 = percentages[i + 1];
    var y1 = upVals[i];
    var y2 = upVals[i + 1];
    var z1 = downVals[i];
    var z2 = downVals[i + 1];
    
    // 线性插值：上行电流 = a*x + b, 下行电流 = c*x + d
    var a = (y2 - y1) / (x2 - x1);
    var b = y1 - a * x1;
    var c = (z2 - z1) / (x2 - x1);
    var d = z1 - c * x1;
    
    // 交叉点: a*x + b = c*x + d => x = (d - b) / (a - c)
    if (Math.abs(a - c) > 0.001) {
      var x = (d - b) / (a - c);
      if (x >= 30 && x <= 60) {
        balancePoint = x;
        found = true;
        break;
      }
    }
  }
  
  if (!found) {
    // 简化方法：取上下行电流最接近时的百分比
    var minDiff = Infinity;
    for (var j = 0; j < upVals.length && j < downVals.length; j++) {
      var diff = Math.abs(upVals[j] - downVals[j]);
      if (diff < minDiff) {
        minDiff = diff;
        balancePoint = percentages[j];
      }
    }
  }
  
  balancePoint = Math.round(balancePoint * 10) / 10;
  att5.平衡系数 = balancePoint.toString();
  
  // 自动回填到id 76
  var task = tasks[currentTaskIndex];
  if (!task.checks[76]) task.checks[76] = {};
  task.checks[76].v = balancePoint + '%';
  
  if (balancePoint >= 40 && balancePoint <= 50) {
    task.checks[76].s = 'ok';
  } else {
    task.checks[76].s = 'ng';
    task.checks[76].n = '平衡系数不在40%-50%范围内';
  }
  
  saveCurrentTask();
  document.getElementById('att5Result').value = balancePoint;
  renderAttachments();
  showToast('平衡系数计算完成: ' + balancePoint + '%');
}

function initSigCanvasFor(suffix) {
  var canvas = document.getElementById('sigCanvas' + suffix);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var drawing = false;
  canvas.width = canvas.offsetWidth || 300;
  canvas.height = 80;
  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var touch = e.touches ? e.touches[0] : e;
    return {x: touch.clientX - rect.left, y: touch.clientY - rect.top};
  }
  canvas.addEventListener('mousedown', function(e){drawing=true;var p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove', function(e){if(!drawing)return;var p=getPos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.stroke();});
  canvas.addEventListener('mouseup', function(){drawing=false;});
  canvas.addEventListener('mouseleave', function(){drawing=false;});
  canvas.addEventListener('touchstart', function(e){e.preventDefault();drawing=true;var p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  canvas.addEventListener('touchmove', function(e){e.preventDefault();if(!drawing)return;var p=getPos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.stroke();},{passive:false});
  canvas.addEventListener('touchend', function(){drawing=false;});
}

function clearSigCanvas(suffix) {
  var canvas = document.getElementById('sigCanvas' + suffix);
  if (canvas) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

// visualViewport键盘遮挡修复 - 动态调整弹窗高度和位置
var _viewportHandler = null;

function adjustModalHeight() {
  var modals = document.querySelectorAll('.mo');
  modals.forEach(function(mo) {
    if (mo.style.display === 'block' || mo.style.display === 'flex') {
      var mi = mo.querySelector('.mi');
      if (mi && window.visualViewport) {
        var vh = window.visualViewport.height;
        var offsetTop = window.visualViewport.offsetTop || 0;
        mi.style.maxHeight = vh + 'px';
        mi.style.top = offsetTop + 'px';
        var mb = mi.querySelector('.mb');
        if (mb) {
          var mh = mi.querySelector('.mh');
          var mc = mi.querySelector('.mc');
          var headerH = mh ? mh.offsetHeight : 50;
          var footerH = mc ? mc.offsetHeight : 60;
          mb.style.maxHeight = (vh - headerH - footerH) + 'px';
        }
      }
    }
  });
}

function bindViewport() {
  if (window.visualViewport && !_viewportHandler) {
    _viewportHandler = function() { adjustModalHeight(); };
    window.visualViewport.addEventListener('resize', _viewportHandler);
    window.visualViewport.addEventListener('scroll', _viewportHandler);
    adjustModalHeight();
  }
}

function unbindViewport() {
  if (_viewportHandler && window.visualViewport) {
    window.visualViewport.removeEventListener('resize', _viewportHandler);
    window.visualViewport.removeEventListener('scroll', _viewportHandler);
    _viewportHandler = null;
  }
}

function openMoBody() {
  var scrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + scrollY + 'px';
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
  document.body.dataset.scrollY = scrollY;
  // 键盘遮挡修复：监听visualViewport
  bindViewport();
}

// 输入框聚焦时自动滚动到可见区域（键盘上方）
document.addEventListener('focusin', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
    var el = e.target;
    // 找到所在的可滚动容器
    var mb = el.closest('.mb');
    if (!mb) return;
    // 延迟等键盘弹出后再滚动
    setTimeout(function() {
      // 确保弹窗高度已调整
      adjustModalHeight();
      // 计算元素在.mb中的相对位置，滚动使其在可见区域中间偏上
      var mbRect = mb.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      // 目标：让输入框在可视区域的中间偏上位置
      var targetY = mbRect.top + mbRect.height * 0.3;
      var scrollOffset = elRect.top - targetY;
      mb.scrollTo({top: mb.scrollTop + scrollOffset, behavior: 'smooth'});
    }, 400);
    setTimeout(function() {
      var mbRect = mb.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      var targetY = mbRect.top + mbRect.height * 0.3;
      var scrollOffset = elRect.top - targetY;
      mb.scrollTo({top: mb.scrollTop + scrollOffset, behavior: 'smooth'});
    }, 800);
  }
});

function closeMoBody() {
  var scrollY = parseInt(document.body.dataset.scrollY || '0');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  document.body.style.overflow = '';
  window.scrollTo(0, scrollY);
  // 移除viewport监听
  unbindViewport();
}

function initSigCanvas() {
  var canvas = document.getElementById('sigCanvas');
  var container = document.getElementById('sigCanvasC');
  canvas.width = container.offsetWidth;
  canvas.height = container.offsetHeight;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#000';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  
  canvas.onmousedown = startDraw;
  canvas.onmousemove = draw;
  canvas.onmouseup = stopDraw;
  canvas.onmouseleave = stopDraw;
  canvas.ontouchstart = function(e) { e.preventDefault(); startDraw(e.touches[0]); };
  canvas.ontouchmove = function(e) { e.preventDefault(); draw(e.touches[0]); };
  canvas.ontouchend = stopDraw;
}

function startDraw(e) {
  isDrawing = true;
  var rect = sigCtx.canvas.getBoundingClientRect();
  var x = (e.clientX || e.pageX) - rect.left;
  var y = (e.clientY || e.pageY) - rect.top;
  sigCtx.beginPath();
  sigCtx.moveTo(x, y);
}

function draw(e) {
  if (!isDrawing) return;
  var rect = sigCtx.canvas.getBoundingClientRect();
  var x = (e.clientX || e.pageX) - rect.left;
  var y = (e.clientY || e.pageY) - rect.top;
  sigCtx.lineTo(x, y);
  sigCtx.stroke();
}

function stopDraw() {
  isDrawing = false;
}

function clearSig() {
  var canvas = document.getElementById('sigCanvas');
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
}

function exportNoticePDF() {
  var task = tasks[currentTaskIndex];
  var now = new Date();
  var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
  var proj = (task.addr || '未命名').replace(/[\\/:*?"<>|]/g, '');
  var checkDateStr = task.checkDate || dateStr;
  var dateForFilename = checkDateStr.replace(/[年月日/\-]/g, '');
  var filename = dateForFilename + '_' + proj + '_整改通知.pdf';

  if (typeof html2canvas === 'undefined') { showToast('html2canvas库未加载，请刷新页面'); return; }
  var JsPDF = (typeof jsPDF !== 'undefined') ? jsPDF : (window.jspdf && window.jspdf.jsPDF);
  if (!JsPDF) { showToast('jsPDF库未加载, window.jspdf=' + typeof window.jspdf); return; }

  showToast('正在准备意见通知书...');

  var ngItems = [];
  checkItems.forEach(function(item) {
    var c = task.checks[item.id];
    if (c && c.s === 'ng') {
      ngItems.push({id:item.id,name:item.name,std:item.std,value:c.v||'',duty:c.d||'A',note:c.n||''});
    }
  });

  var htmlContent = buildNoticeFullHTML(task, dateStr, ngItems);
  var container = document.createElement('div');
  container.style.cssText = 'position:absolute;left:-9999px;top:0;z-index:-1;';
  document.body.appendChild(container);
  var div = document.createElement('div');
  div.style.cssText = 'width:595px;padding:57px;font-family:SimSun,serif;background:#fff;color:#000;font-size:12px;line-height:1.5;';
  div.innerHTML = htmlContent;
  container.appendChild(div);

  showToast('正在渲染...');
  setTimeout(function() {
    html2canvas(div, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', logging: false, removeContainer: false,
      width: div.scrollWidth, height: div.scrollHeight
    }).then(function(canvas) {
      try {
        var pdf = new JsPDF({orientation: 'p', unit: 'mm', format: 'a4'});
        var pageW = 210, pageH = 297;
        var imgW = pageW;
        var imgH = (canvas.height * imgW) / canvas.width;
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        if (imgH <= pageH) {
          pdf.addImage(imgData, 'JPEG', 0, 0, imgW, imgH);
        } else {
          var pos = 0;
          while (pos < imgH) {
            if (pos > 0) pdf.addPage();
            pdf.addImage(imgData, 'JPEG', 0, -pos, imgW, imgH);
            pos += pageH;
          }
        }
        pdf.save(filename);
        var pageCount = Math.ceil(imgH / pageH);
        showToast('意见通知书导出成功！共' + pageCount + '页');
      } catch(err) {
        console.error('PDF组装失败:', err);
        showToast('PDF组装失败: ' + (err.message||err));
      }
      if (container.parentNode) container.parentNode.removeChild(container);
    }).catch(function(err) {
      console.error('渲染失败:', err);
      showToast('渲染失败: ' + (err.message||err));
      if (container.parentNode) container.parentNode.removeChild(container);
    });
  }, 300);
}

        console.error(sec.label + '渲染失败:', err);

        if (container.parentNode) container.parentNode.removeChild(container);
        idx++;
        renderNext();
      });
    }, 300);
  }

  renderNext();
}

function assembleCheckPDF(canvases, filename, JsPDF) {
  try {
    var pdf = new JsPDF({orientation: 'l', unit: 'mm', format: 'a4'});
    var pageCount = 0;
    canvases.forEach(function(item, i) {
      var canvas = item.canvas;
      var isLand = item.orientation === 'landscape';
      var imgW = isLand ? 297 : 210;
      var imgH = isLand ? 210 : 297;
      var imgData = canvas.toDataURL('image/jpeg', 0.92);
      if (i > 0) pdf.addPage(isLand ? 'l' : 'p');
      pdf.addImage(imgData, 'JPEG', 0, 0, imgW, imgH);
      pageCount++;
    });
    pdf.save(filename);
    showToast('检查表导出成功！共' + pageCount + '页');
  } catch(err) {
    console.error('检查表PDF组装失败:', err);
    showToast('检查表PDF组装失败: ' + (err.message||err));
  }
}

// HTML转义辅助函数
function escHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function build3ColTable(items, task) {
  var colSize = Math.ceil(items.length / 3);
  var col1 = items.slice(0, colSize);
  var col2 = items.slice(colSize, colSize * 2);
  var col3 = items.slice(colSize * 2);
  var maxRows = Math.max(col1.length, col2.length, col3.length);
  
  var h = '<table style="width:100%;border-collapse:collapse;font-size:8px;">';
  h += '<tr style="background:#f0f0f0;font-weight:bold;">';
  h += '<td style="border:1px solid #000;padding:1px 2px;width:4%;text-align:center;">序</td><td style="border:1px solid #000;padding:1px 2px;width:26%;">检查内容</td><td style="border:1px solid #000;padding:1px 2px;width:7%;text-align:center;">结论</td>';
  h += '<td style="border:1px solid #000;padding:1px 2px;width:4%;text-align:center;">序</td><td style="border:1px solid #000;padding:1px 2px;width:26%;">检查内容</td><td style="border:1px solid #000;padding:1px 2px;width:7%;text-align:center;">结论</td>';
  h += '<td style="border:1px solid #000;padding:1px 2px;width:4%;text-align:center;">序</td><td style="border:1px solid #000;padding:1px 2px;width:26%;">检查内容</td><td style="border:1px solid #000;padding:1px 2px;width:7%;text-align:center;">结论</td>';
  h += '</tr>';
  
  for (var r = 0; r < maxRows; r++) {
    h += '<tr>';
    [col1, col2, col3].forEach(function(col) {
      if (r < col.length) {
        var item = col[r]; var c = task.checks[item.id] || {};
        var res = c.s === 'ok' ? '√' : (c.s === 'ng' ? '×' : (c.s === 'na' ? '/' : (c.v || '')));
        h += '<td style="border:1px solid #000;padding:1px 2px;text-align:center;">' + item.id + '</td>';
        h += '<td style="border:1px solid #000;padding:1px 2px;">' + escHtml(item.name) + (c.n ? '<br><span style="color:red;font-size:7px;">备注:'+escHtml(c.n)+'</span>' : '') + '</td>';
        h += '<td style="border:1px solid #000;padding:1px 2px;text-align:center;">' + res + '</td>';
      } else {
        h += '<td style="border:1px solid #000;padding:1px;"></td><td style="border:1px solid #000;padding:1px;"></td><td style="border:1px solid #000;padding:1px;"></td>';
      }
    });
    h += '</tr>';
  }
  h += '</table>';
  return h;
}

// ============ NOTICE ============
function showNotice() {
  goPage('notice');
  renderNoticeList();
}

function renderNoticeList() {
  var task = tasks[currentTaskIndex];
  var ngItems = [];
  checkItems.forEach(function(item) {
    var c = task.checks[item.id];
    if (c && c.s === 'ng') {
      ngItems.push({
        id: item.id,
        name: item.name,
        std: item.std,
        value: c.v || '',
        duty: c.d || 'A',
        note: c.n || ''
      });
    }
  });
  
  var container = document.getElementById('noticeList');
  if (ngItems.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#28a745;"><div style="font-size:48px;margin-bottom:12px;">✓</div><div style="font-size:16px;">本次检验未发现不合格项</div></div>';
    return;
  }
  
  var dutyMap = {A:'安装/维保',B:'工厂',C:'客户',D:'调试',E:'监督'};
  var html = '';
  ngItems.forEach(function(item, i) {
    html += '<div class="notice-item">' +
      '<div class="notice-item-header">' +
        '<span class="notice-seq">#' + (i+1) + ' 项' + item.id + '</span>' +
        '<span class="notice-duty">' + (dutyMap[item.duty]||item.duty) + '</span>' +
      '</div>' +
      '<div class="notice-content">' + item.name + '</div>' +
      '<div class="notice-std">标准: ' + item.std + ' | 实测: ' + item.value + '</div>' +
      (item.note ? '<div style="margin-top:4px;font-size:12px;color:#dc3545;">问题: ' + item.note + '</div>' : '') +
    '</div>';
  });
  
  html += '<div style="margin-top:20px;padding:16px;background:#fff;border-radius:12px;border:1.5px solid #e2e8f0;">' +
    '<div style="font-weight:700;margin-bottom:12px;">厂检意见:</div>' +
    '<div style="margin-bottom:8px;">□厂检不合格，以上问题请于____年____月____日前整改完毕</div>' +
    '<div>□厂检合格</div>' +
  '</div>';
  
  container.innerHTML = html;
}
