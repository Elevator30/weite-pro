<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威特电梯厂检调试记录单V2 - 数据导出</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f7fa; padding: 20px; }
.container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
h1 { font-size: 20px; color: #333; margin-bottom: 20px; text-align: center; }
.status { text-align: center; padding: 20px; background: #f0f9ff; border-radius: 8px; margin-bottom: 20px; }
.status.error { background: #fff1f0; }
.status.success { background: #f6ffed; }
.status p { font-size: 14px; color: #666; line-height: 1.8; }
.status .num { font-size: 32px; font-weight: bold; color: #1890ff; }
.status.error .num { color: #ff4d4f; }
.status.success .num { color: #52c41a; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 12px; }
.btn-primary { background: #1890ff; color: #fff; }
.btn-primary:active { background: #096dd9; }
.btn-secondary { background: #f0f0f0; color: #333; }
.tip { font-size: 12px; color: #999; text-align: center; line-height: 1.6; margin-top: 16px; }
.proj-list { margin-top: 16px; }
.proj-item { padding: 10px 12px; background: #fafafa; border-radius: 6px; margin-bottom: 8px; font-size: 14px; color: #333; }
.proj-item .name { font-weight: 500; }
.proj-item .meta { font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
<h1>📋 数据导出</h1>
<div id="status" class="status">
<p>正在读取数据...</p>
</div>
<div id="projList" class="proj-list" style="display:none;"></div>
<button class="btn btn-primary" onclick="exportJSON()" id="exportBtn" disabled>导出JSON数据文件</button>
<p class="tip">导出后请保存好文件，后续可导入恢复数据</p>
</div>
<script>
var STORAGE_KEY = 'WEITE_CHECK_V4';
var data = null;

function init() {
  try {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) {
      showError('未找到数据');
      return;
    }
    var projects = JSON.parse(stored);
    if (!Array.isArray(projects) || projects.length === 0) {
      showError('数据为空');
      return;
    }
    data = projects;
    showSuccess(projects);
    document.getElementById('exportBtn').disabled = false;
  } catch(e) {
    showError('数据读取失败：' + e.message);
  }
}

function showError(msg) {
  var el = document.getElementById('status');
  el.className = 'status error';
  el.innerHTML = '<div class="num">❌</div><p>' + msg + '</p>';
}

function showSuccess(projects) {
  var el = document.getElementById('status');
  var totalTasks = 0;
  projects.forEach(function(p) {
    if (p.tasks && p.tasks.length) totalTasks += p.tasks.length;
  });
  el.className = 'status success';
  el.innerHTML = '<div class="num">' + projects.length + ' 个项目</div><p>共 ' + totalTasks + ' 条检查记录</p>';
  
  var listEl = document.getElementById('projList');
  listEl.style.display = 'block';
  var html = '';
  projects.forEach(function(p) {
    var taskCount = (p.tasks && p.tasks.length) || 0;
    html += '<div class="proj-item"><div class="name">' + (p.name || '未命名项目') + '</div><div class="meta">' + taskCount + ' 条记录</div></div>';
  });
  listEl.innerHTML = html;
}

function exportJSON() {
  if (!data) return;
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '威特厂检数据备份_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

init();
</script>
</body>
</html>
