<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据导出</title>
<style>
body{font-family:-apple-system,sans-serif;padding:20px;max-width:600px;margin:0 auto;}
h1{font-size:18px;}
.btn{display:block;width:100%;padding:15px;margin:10px 0;font-size:16px;border:none;border-radius:8px;background:#007aff;color:#fff;}
.btn.secondary{background:#f2f2f2;color:#333;}
#status{padding:10px;margin:10px 0;border-radius:8px;background:#e8f5e9;display:none;}
#status.error{background:#ffebee;}
.info{font-size:14px;color:#666;margin:15px 0;line-height:1.6;}
.project-list{margin:10px 0;}
.project-item{padding:10px;border:1px solid #ddd;border-radius:6px;margin:5px 0;font-size:14px;}
</style>
</head>
<body>
<h1>数据导出工具</h1>
<div class="info">
检测到以下数据：
</div>
<div id="projectList" class="project-list">加载中...</div>
<div id="status"></div>
<button class="btn" onclick="exportData()">导出全部数据（JSON文件）</button>
<button class="btn secondary" onclick="copyToSafari()">复制数据到Safari浏览器</button>
<div class="info" style="margin-top:20px;font-size:12px;color:#999;">
说明：导出JSON后，在Safari中打开完整页面导入即可恢复。<br>
"复制到Safari"功能会尝试跨容器共享数据（可能不成功，建议用导出文件方式）。
</div>

<script>
const STORAGE_KEY = 'WEITE_CHECK_V4';

function showStatus(msg, isError) {
  var s = document.getElementById('status');
  s.textContent = msg;
  s.style.display = 'block';
  s.className = isError ? 'error' : '';
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      document.getElementById('projectList').innerHTML = '<div style="color:#999;">未找到数据</div>';
      return null;
    }
    var data = JSON.parse(raw);
    var projects = data.projects || [];
    var html = '共 ' + projects.length + ' 个项目：<br>';
    for (var i = 0; i < projects.length; i++) {
      html += '<div class="project-item">' + (i+1) + '. ' + (projects[i].projectName || '未命名') + ' - ' + (projects[i].productNo || '') + '</div>';
    }
    document.getElementById('projectList').innerHTML = html;
    return data;
  } catch(e) {
    document.getElementById('projectList').innerHTML = '<div style="color:red;">读取失败: ' + e.message + '</div>';
    return null;
  }
}

function exportData() {
  var data = loadData();
  if (!data) {
    showStatus('没有数据可导出', true);
    return;
  }
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '威特电梯数据备份_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus('导出成功！文件已开始下载。请保存到"文件"App中。', false);
}

function copyToSafari() {
  var raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    showStatus('没有数据可复制', true);
    return;
  }
  try {
    // 尝试通过共享存储传递（iOS PWA和Safari共享cookie但不共享localStorage）
    // 用iframe方式尝试
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    try {
      iframe.contentWindow.localStorage.setItem(STORAGE_KEY, raw);
      showStatus('已尝试复制到Safari存储域。请在Safari中打开页面查看是否有数据。', false);
    } catch(e) {
      // 跨域失败，用剪贴板
      if (navigator.clipboard) {
        navigator.clipboard.writeText(raw).then(function() {
          showStatus('数据已复制到剪贴板。请在Safari中打开页面后，在控制台粘贴恢复。', false);
        }).catch(function() {
          showStatus('复制失败，请使用"导出全部数据"方式', true);
        });
      } else {
        showStatus('浏览器不支持剪贴板，请使用"导出全部数据"方式', true);
      }
    }
  } catch(e) {
    showStatus('复制失败: ' + e.message + '，请使用导出文件方式', true);
  }
}

// 页面加载完成后自动检测并触发service worker更新
window.addEventListener('load', function() {
  loadData();
  // 触发service worker更新检查
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(function(reg) {
      if (reg) {
        reg.update();
      }
    });
  }
});
</script>
</body>
</html>
