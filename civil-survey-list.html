<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>土建勘测 - 项目列表</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a3a6b'/%3E%3Ctext x='50' y='42' font-family='Arial' font-size='28' font-weight='900' text-anchor='middle' fill='white'%3EVEITE%3C/text%3E%3Ctext x='50' y='72' font-family='serif' font-size='16' font-weight='800' text-anchor='middle' fill='%23e63946'%3E电梯%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','微软雅黑',sans-serif;background:#f5f7fa;padding-bottom:80px;-webkit-overflow-scrolling:touch;min-height:100vh;}

/* 顶部Header */
.header{padding:14px 16px 12px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.header-top{display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#2d3748;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.header-title{font-size:18px;font-weight:700;color:#1a3a6b;}
.header-menu{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#4a5568;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;}
.header-sub{font-size:12px;color:#718096;text-align:center;margin-top:4px;letter-spacing:2px;}

/* 统计卡片 */
.stats-bar{background:#fff;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-bottom:1px solid #edf2f7;}
.stat-item{text-align:center;padding:10px 8px;background:linear-gradient(135deg,#f8f9ff,#f5f3ff);border-radius:12px;}
.stat-num{font-size:22px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:11px;color:#718096;margin-top:4px;}

/* 列表区 */
.list-section{padding:0 16px;}
.list-section-title{font-size:13px;font-weight:700;color:#718096;padding:14px 4px 10px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.list-count{font-size:12px;color:#a0aec0;font-weight:400;}

/* 项目卡片 */
.project-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;transition:all .2s ease;}
.project-card:active{transform:scale(.99);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-project{font-size:16px;font-weight:700;color:#2d3748;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;line-height:1.3;}
.card-date-tag{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:10px;padding:3px 10px;border-radius:12px;font-weight:600;flex-shrink:0;}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:12px;}
.meta-item{font-size:12px;color:#4a5568;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta-label{color:#a0aec0;flex-shrink:0;}
.meta-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{font-size:11px;padding:3px 10px;border-radius:8px;background:#edf2f7;color:#718096;font-weight:500;}
.tag-signed{background:#e6fffa;color:#234e52;}
.tag-type{background:#fefcbf;color:#744210;}
.card-btns{display:flex;gap:8px;padding-top:12px;border-top:1px solid #edf2f7;}
.card-btn{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-view{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn-print{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;}
.btn-delete{background:#fff5f5;color:#c53030;border:1px solid #fed7d7;}

/* 空状态 */
.empty-state{text-align:center;padding:80px 20px;color:#a0aec0;}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.5;}
.empty-title{font-size:16px;font-weight:600;color:#718096;margin-bottom:8px;}
.empty-desc{font-size:13px;color:#a0aec0;line-height:1.6;}

/* 悬浮新建按钮 */
.fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(102,126,234,.5);cursor:pointer;z-index:100;-webkit-tap-highlight-color:transparent;transition:transform .15s;}
.fab:active{transform:scale(.94);}

/* Toast */
.toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;max-width:80%;text-align:center;}

/* 确认弹窗 */
.confirm-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:30px;}
.confirm-mask.show{display:flex;}
.confirm-box{background:#fff;border-radius:14px;padding:22px;max-width:320px;width:100%;text-align:center;}
.confirm-box h3{font-size:17px;font-weight:700;color:#2d3748;margin-bottom:10px;}
.confirm-box p{font-size:13px;color:#718096;margin-bottom:18px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-cancel{flex:1;padding:11px;border:1px solid #e2e8f0;border-radius:9px;background:#f7fafc;color:#718096;font-size:14px;cursor:pointer;font-weight:500;}
.confirm-ok{flex:1;padding:11px;border:none;border-radius:9px;background:#e53e3e;color:#fff;font-size:14px;cursor:pointer;font-weight:600;}

/* 右上角下拉菜单 */
.menu-dropdown{position:absolute;top:44px;right:8px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:200;overflow:hidden;display:none;min-width:140px;}
.menu-dropdown.show{display:block;}
.menu-dropdown-item{padding:12px 16px;font-size:14px;color:#4a5568;cursor:pointer;display:flex;align-items:center;gap:8px;}
.menu-dropdown-item:active{background:#f7fafc;}
.menu-dropdown-item.danger{color:#e53e3e;}
.menu-dropdown-divider{height:1px;background:#edf2f7;}

@media(max-width:360px){
  .card-project{font-size:15px;}
  .stat-num{font-size:20px;}
}
</style>
</head>
<body>

<!-- 顶部Header -->
<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="header-back" onclick="goHome()">‹</div>
      <div class="header-title">土建勘测</div>
    </div>
    <div class="header-menu" onclick="toggleMenu(event)">≡
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-dropdown-item" onclick="goHome()">🏠 首页</div>
        <div class="menu-dropdown-divider"></div>
        <div class="menu-dropdown-item" onclick="migrateOldData()">📦 数据迁移</div>
        <div class="menu-dropdown-item" onclick="exportData()">📤 导出数据</div>
        <div class="menu-dropdown-item" onclick="importData()">📥 导入数据</div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;">
      </div>
    </div>
  </div>
  <div class="header-sub">CIVIL SURVEY</div>
</div>

<!-- 统计卡片 -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="statTotal">0</div>
    <div class="stat-label">总项目</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statMonth">0</div>
    <div class="stat-label">本月新增</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statSigned">0</div>
    <div class="stat-label">已签字</div>
  </div>
</div>

<!-- 列表区 -->
<div class="list-section">
  <div class="list-section-title">
    <span>勘测项目</span>
    <span class="list-count" id="listCount">共 0 条</span>
  </div>
  <div id="projectList"></div>
</div>

<!-- 悬浮新建按钮 -->
<div class="fab" onclick="goNew()">+</div>

<div class="toast" id="toast"></div>

<!-- 确认删除弹窗 -->
<div class="confirm-mask" id="confirmMask">
  <div class="confirm-box">
    <h3 id="confirmTitle">确认删除</h3>
    <p id="confirmMsg">确定要删除这条勘测记录吗？删除后无法恢复。</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="hideConfirm()">取消</button>
      <button class="confirm-ok" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var STORAGE_KEY = 'wtCivilSurveyList';
var list = [];
var pendingDeleteId = null;

// ============ 工具函数 ============
function showToast(msg, dur){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.style.display = 'none'; }, dur || 2000);
}

function escapeHtml(str){
  if(!str) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function formatDate(ts){
  if(!ts) return '';
  var d = new Date(ts);
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function genId(){
  return 'cs_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

// ============ 数据加载保存 ============
function loadList(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    list = raw ? JSON.parse(raw) : [];
  }catch(e){
    list = [];
    console.error('加载失败', e);
  }
  // 按更新时间倒序
  list.sort(function(a,b){ return (b.updateTime||0) - (a.updateTime||0); });
}

function saveList(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }catch(e){
    showToast('保存失败：' + (e.message||'未知错误'));
  }
}

// ============ 渲染列表 ============
function renderList(){
  var container = document.getElementById('projectList');
  var countEl = document.getElementById('listCount');
  var statTotal = document.getElementById('statTotal');
  var statMonth = document.getElementById('statMonth');
  var statSigned = document.getElementById('statSigned');
  
  countEl.textContent = '共 ' + list.length + ' 条';
  statTotal.textContent = list.length;
  
  // 本月新增
  var now = new Date();
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  var monthCount = list.filter(function(item){ return (item.createTime||0) >= monthStart; }).length;
  statMonth.textContent = monthCount;
  
  // 已签字
  var signedCount = list.filter(function(item){ return item.signatures && item.signatures.surveyor; }).length;
  statSigned.textContent = signedCount;
  
  if(!list.length){
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">暂无勘测项目</div><div class="empty-desc">点击右下角 + 按钮<br>创建第一个土建勘测项目</div></div>';
    return;
  }
  
  var html = '';
  for(var i=0;i<list.length;i++){
    var item = list[i];
    var loc = item.location || {};
    var locStr = [loc.province, loc.city, loc.district].filter(Boolean).join(' ') || '未设置';
    var hasSigned = item.signatures && item.signatures.surveyor;
    var typeTag = item.elevatorModel || item.elevatorType || '客梯';
    
    html += '<div class="project-card">';
    html += '<div class="card-top">';
    html += '<div class="card-project">' + escapeHtml(item.projectName || '未命名项目') + '</div>';
    html += '<div class="card-date-tag">' + formatDate(item.createTime) + '</div>';
    html += '</div>';
    html += '<div class="card-meta">';
    html += '<div class="meta-item"><span class="meta-label">📍</span><span class="meta-value" title="' + escapeHtml(locStr) + '">' + escapeHtml(locStr) + '</span></div>';
    html += '<div class="meta-item"><span class="meta-label">👤</span><span class="meta-value">' + escapeHtml(item.sales || '未设置') + '</span></div>';
    html += '<div class="meta-item"><span class="meta-label">📞</span><span class="meta-value">' + escapeHtml(item.phone || '-') + '</span></div>';
    html += '<div class="meta-item"><span class="meta-label">🛗</span><span class="meta-value">' + escapeHtml(item.load||'') + 'kg / ' + escapeHtml(item.speed||'') + 'm/s</span></div>';
    html += '</div>';
    html += '<div class="card-tags">';
    html += '<span class="tag tag-type">' + escapeHtml(typeTag) + '</span>';
    if(hasSigned){ html += '<span class="tag tag-signed">✓ 已签字</span>'; }
    if(item.floorData && item.floorData.length){ html += '<span class="tag">' + item.floorData.length + '层</span>'; }
    html += '</div>';
    html += '<div class="card-btns">';
    html += '<button class="card-btn btn-view" onclick="goDetail(\'' + item.id + '\')">查看/编辑</button>';
    html += '<button class="card-btn btn-print" onclick="printItem(\'' + item.id + '\')">打印</button>';
    html += '<button class="card-btn btn-delete" onclick="confirmDelete(\'' + item.id + '\')">删除</button>';
    html += '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

// ============ 跳转 ============
function goHome(){
  window.location.href = 'index.html';
}

function goNew(){
  window.location.href = 'civil-survey-detail.html';
}

function goDetail(id){
  window.location.href = 'civil-survey-detail.html?id=' + id;
}

function printItem(id){
  window.location.href = 'civil-survey-detail.html?id=' + id + '&print=1';
}

// ============ 删除 ============
function confirmDelete(id){
  pendingDeleteId = id;
  var item = list.find(function(x){ return x.id === id; });
  if(item){
    document.getElementById('confirmMsg').innerHTML = '确定要删除项目 <strong>' + escapeHtml(item.projectName||'未命名') + '</strong> 吗？<br>所有勘测数据将被删除，且无法恢复。';
  }
  document.getElementById('confirmMask').classList.add('show');
}

function hideConfirm(){
  document.getElementById('confirmMask').classList.remove('show');
  pendingDeleteId = null;
}

function doDelete(){
  if(!pendingDeleteId) return;
  list = list.filter(function(x){ return x.id !== pendingDeleteId; });
  saveList();
  renderList();
  hideConfirm();
  showToast('已删除');
}

// ============ 菜单 ============
function toggleMenu(e){
  e.stopPropagation();
  var m = document.getElementById('menuDropdown');
  m.classList.toggle('show');
}

document.addEventListener('click', function(){
  var m = document.getElementById('menuDropdown');
  if(m) m.classList.remove('show');
});

// ============ 导出导入 ============
function exportData(){
  if(!list.length){ showToast('暂无数据可导出'); return; }
  var blob = new Blob([JSON.stringify(list, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '土建勘测数据_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + list.length + ' 条记录');
  document.getElementById('menuDropdown').classList.remove('show');
}

function importData(){
  document.getElementById('importFileInput').click();
  document.getElementById('menuDropdown').classList.remove('show');
}

document.getElementById('importFileInput').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error('格式错误');
      var added = 0;
      data.forEach(function(item){
        if(item && item.id && !list.some(function(x){ return x.id === item.id; })){
          list.push(item);
          added++;
        }
      });
      saveList();
      renderList();
      showToast('导入成功，新增 ' + added + ' 条');
    }catch(err){
      showToast('导入失败：' + (err.message||'格式错误'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ============ 旧数据迁移 ============
function migrateOldData(){
  document.getElementById('menuDropdown').classList.remove('show');
  
  // 尝试从旧版 civil-survey.html 用的 IndexedDB 或 localStorage 读取
  var migrated = 0;
  
  // 先检查 localStorage 中是否有旧格式数据
  var oldKeys = Object.keys(localStorage).filter(function(k){
    return k.indexOf('wtCivil') === 0 || k.indexOf('civil_') === 0 || k.indexOf('cs_') === 0;
  });
  
  // 检查 IndexedDB (旧版用的 WeiteKV)
  if(typeof indexedDB !== 'undefined'){
    try{
      var req = indexedDB.open('WeiteKV', 1);
      req.onsuccess = function(){
        var db = req.result;
        try{
          var tx = db.transaction('kv', 'readonly');
          var store = tx.objectStore('kv');
          var cursorReq = store.openCursor();
          cursorReq.onsuccess = function(){
            var cursor = cursorReq.result;
            if(cursor){
              var key = cursor.key;
              // 判断是否土建勘测旧数据
              if(typeof key === 'string' && (
                key.indexOf('proj_') === 0 || key.indexOf('civil') >= 0 || key.indexOf('survey') >= 0
              )){
                var val = cursor.value;
                try{
                  var obj = JSON.parse(val);
                  if(obj && obj.name && obj.buildings){
                    // 旧版项目-楼栋-电梯结构，展平为单条勘测记录
                    migrated += migrateOldProject(obj);
                  }
                }catch(e){}
              }
              cursor.continue();
            }else{
              if(migrated > 0){
                saveList();
                loadList();
                renderList();
                showToast('迁移完成，新增 ' + migrated + ' 条');
              }else{
                showToast('未发现可迁移的旧数据');
              }
            }
          };
        }catch(e){
          showToast('迁移失败');
        }
      };
      req.onerror = function(){
        showToast('未发现可迁移的旧数据');
      };
    }catch(e){
      showToast('迁移失败');
    }
  }else{
    showToast('当前环境不支持数据迁移');
  }
}

function migrateOldProject(proj){
  var count = 0;
  if(!proj.buildings) return 0;
  for(var i=0;i<proj.buildings.length;i++){
    var b = proj.buildings[i];
    if(!b.elevators) continue;
    for(var j=0;j<b.elevators.length;j++){
      var e = b.elevators[j];
      // 转换为新格式
      var newItem = convertOldElevatorToNew(proj, b, e);
      if(!list.some(function(x){ return x.id === newItem.id; })){
        list.push(newItem);
        count++;
      }
    }
  }
  return count;
}

function convertOldElevatorToNew(proj, bldg, elev){
  var newId = 'mig_' + (elev.id || genId());
  // 避免重复
  if(list.some(function(x){ return x.id === newId; })){
    newId = genId();
  }
  
  var location = {};
  if(proj.location){
    // 简单解析旧地址
    location.detail = proj.location;
  }
  
  return {
    id: newId,
    projectName: proj.name + (bldg.name ? ' - ' + bldg.name : '') + (elev.elevatorNo ? ' - ' + elev.elevatorNo : ''),
    location: location,
    sales: proj.sales || '',
    phone: proj.phone || '',
    elevatorModel: elev.elevatorType || '',
    load: elev.load || '',
    speed: elev.speed || '',
    floors: elev.floors || '',
    stops: elev.stops || '',
    doorType: elev.doorType || '中分',
    doorPosition: elev.isThrough === '是' ? '贯通' : '前门',
    createTime: proj.createTime || proj.updateTime || Date.now(),
    updateTime: proj.updateTime || Date.now(),
    migrated: true,
    
    // 井道结构
    shaft: {
      walls: {
        back: { type: elev.backWallType || '砖混墙', thick: elev.backWallThick || '', outer: elev.backWallOuter || '否', ringBeam: elev.backRingBeam || '', bracket: elev.backBracket || '' },
        left: { type: elev.leftWallType || '砖混墙', thick: elev.leftWallThick || '', outer: elev.leftWallOuter || '否', ringBeam: elev.leftRingBeam || '', bracket: elev.leftBracket || '' },
        right: { type: elev.rightWallType || '砖混墙', thick: elev.rightWallThick || '', outer: elev.rightWallOuter || '否', ringBeam: elev.rightRingBeam || '', bracket: elev.rightBracket || '' },
        front: { type: elev.frontWallType || '砖混墙', thick: elev.frontWallThick || '', outer: elev.frontWallOuter || '否', ringBeam: elev.frontRingBeam || '', bracket: elev.frontBracket || '' }
      },
      headerBeam: elev.hasHeaderBeam || '有',
      pier: {
        structure: elev.pierStructure || '混凝土',
        status: elev.pierStatus || '未建',
        leftWidth: elev.pierLeftWidth || '',
        rightWidth: elev.pierRightWidth || '',
        hasPier: '有'
      },
      callBoxType: elev.callBoxType || '有底盒',
      hasCorbel: elev.hasCorbel || '无',
      isThrough: elev.isThrough || '否',
      powerSupply: elev.powerSupply || '三相380V'
    },
    
    // 顶层底坑
    topPit: {
      isSightseeing: elev.sightseeingType ? '是' : '否',
      sightseeingType: elev.sightseeingType || '方形',
      pitMeasuredDepth: elev.pitDepth || '',
      pitFinishHeight: '',
      pitDepth: elev.pitDepth || '',
      topMeasuredHeight: elev.topHeight || '',
      topFinishHeight: '',
      topHeight: elev.topHeight || ''
    },
    
    // 楼层
    floorData: elev.floorData || [],
    
    liftHeight: elev.liftHeight || '',
    wellTotalHeight: elev.wellTotalHeight || '',
    
    // 示意图
    sketches: elev.sketches ? { shaftDiagram: elev.sketches[0] || '', machineRoomDiagram: elev.sketches[1] || '' } : {},
    
    // 签字
    signatures: {
      surveyor: (elev.signatures && elev.signatures.surveyor) || ''
    },
    
    specialNotes: elev.specialNotes || ''
  };
}

// ============ 初始化 ============
loadList();
renderList();

// 暴露全局函数
window.goHome = goHome;
window.goNew = goNew;
window.goDetail = goDetail;
window.printItem = printItem;
window.confirmDelete = confirmDelete;
window.hideConfirm = hideConfirm;
window.doDelete = doDelete;
window.toggleMenu = toggleMenu;
window.exportData = exportData;
window.importData = importData;
window.migrateOldData = migrateOldData;

})();
</script>
