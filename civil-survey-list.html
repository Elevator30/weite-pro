<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>土建勘测 - 项目列表</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a3a6b'/%3E%3Ctext x='50' y='42' font-family='Arial' font-size='28' font-weight='900' text-anchor='middle' fill='white'%3EVEITE%3C/text%3E%3Ctext x='50' y='72' font-family='serif' font-size='16' font-weight='800' text-anchor='middle' fill='%23e63946'%3E电梯%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','微软雅黑',sans-serif;background:#f5f7fa;padding-bottom:80px;-webkit-overflow-scrolling:touch;min-height:100vh;}

/* 顶部Header */
.header{padding:14px 16px 12px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.header-top{display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#2d3748;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.header-title{font-size:18px;font-weight:700;color:#1a3a6b;}
.header-menu{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#4a5568;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;}
.header-sub{font-size:12px;color:#718096;text-align:center;margin-top:4px;letter-spacing:2px;}

/* 统计卡片 */
.stats-bar{background:#fff;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-bottom:1px solid #edf2f7;}
.stat-item{text-align:center;padding:10px 8px;background:linear-gradient(135deg,#f8f9ff,#f5f3ff);border-radius:12px;}
.stat-num{font-size:22px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:11px;color:#718096;margin-top:4px;}

/* 列表区 */
.list-section{padding:0 16px;}
.list-section-title{font-size:13px;font-weight:700;color:#718096;padding:14px 4px 10px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.list-count{font-size:12px;color:#a0aec0;font-weight:400;}

/* 项目卡片 */
.project-card{background:#fff;border-radius:14px;margin-bottom:12px;border:1.5px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;transition:all .2s ease;overflow:hidden;}
.project-card:active{transform:scale(.995);}
.project-card-header{padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;}
.project-card-header:active{background:#f7fafc;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-project{font-size:16px;font-weight:700;color:#2d3748;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;line-height:1.3;}
.card-edit-btn{background:none;border:none;color:#667eea;font-size:18px;cursor:pointer;padding:2px 8px;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px;}
.meta-item{font-size:12px;color:#4a5568;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta-label{color:#a0aec0;flex-shrink:0;}
.meta-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-bottom{display:flex;justify-content:space-between;align-items:center;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11px;padding:3px 10px;border-radius:8px;background:#edf2f7;color:#718096;font-weight:500;}
.tag-signed{background:#e6fffa;color:#234e52;}
.tag-type{background:#fefcbf;color:#744210;}
.tag-count{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.card-expand-arrow{font-size:14px;color:#a0aec0;transition:transform .25s ease;flex-shrink:0;}
.project-card.expanded .card-expand-arrow{transform:rotate(180deg);color:#667eea;}

/* 测量记录展开区 */
.measurements-section{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#f8fafc;border-top:1px solid #edf2f7;}
.project-card.expanded .measurements-section{max-height:2000px;}
.measurements-inner{padding:12px 16px 16px;}
.meas-list{display:flex;flex-direction:column;gap:10px;}
.meas-card{background:#fff;border-radius:10px;padding:12px 14px;border:1.5px solid #e2e8f0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;position:relative;}
.meas-card:active{transform:scale(.99);background:#f8f9ff;border-color:#667eea;}
.meas-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.meas-title{font-size:14px;font-weight:700;color:#2d3748;}
.meas-type-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.meas-type-straight{background:#ebf8ff;color:#2b6cb0;}
.meas-type-escalator{background:#fefcbf;color:#744210;}
.meas-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:#718096;}
.meas-meta-item{display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meas-meta-label{color:#a0aec0;flex-shrink:0;font-size:11px;}
.meas-meta-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meas-signed-badge{position:absolute;top:12px;right:14px;font-size:10px;background:#c6f6d5;color:#22543d;padding:2px 8px;border-radius:10px;font-weight:600;}

/* 新建测量按钮 */
.new-meas-btn{width:100%;padding:10px;border:1.5px dashed #cbd5e0;border-radius:10px;background:#fff;color:#718096;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;transition:all .15s;}
.new-meas-btn:active{background:#f0f4ff;border-color:#667eea;color:#667eea;}

/* 空状态 */
.empty-state{text-align:center;padding:80px 20px;color:#a0aec0;}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.5;}
.empty-title{font-size:16px;font-weight:600;color:#718096;margin-bottom:8px;}
.empty-desc{font-size:13px;color:#a0aec0;line-height:1.6;}

/* 悬浮新建按钮 */
.fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(102,126,234,.5);cursor:pointer;z-index:100;-webkit-tap-highlight-color:transparent;transition:transform .15s;}
.fab:active{transform:scale(.94);}

/* Toast */
.toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;max-width:80%;text-align:center;}

/* 确认弹窗 */
.confirm-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:30px;}
.confirm-mask.show{display:flex;}
.confirm-box{background:#fff;border-radius:14px;padding:22px;max-width:320px;width:100%;text-align:center;}
.confirm-box h3{font-size:17px;font-weight:700;color:#2d3748;margin-bottom:10px;}
.confirm-box p{font-size:13px;color:#718096;margin-bottom:18px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-cancel{flex:1;padding:11px;border:1px solid #e2e8f0;border-radius:9px;background:#f7fafc;color:#718096;font-size:14px;cursor:pointer;font-weight:500;}
.confirm-ok{flex:1;padding:11px;border:none;border-radius:9px;background:#e53e3e;color:#fff;font-size:14px;cursor:pointer;font-weight:600;}

/* 右上角下拉菜单 */
.menu-dropdown{position:absolute;top:44px;right:8px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:200;overflow:hidden;display:none;min-width:140px;}
.menu-dropdown.show{display:block;}
.menu-dropdown-item{padding:12px 16px;font-size:14px;color:#4a5568;cursor:pointer;display:flex;align-items:center;gap:8px;}
.menu-dropdown-item:active{background:#f7fafc;}
.menu-dropdown-item.danger{color:#e53e3e;}
.menu-dropdown-divider{height:1px;background:#edf2f7;}

/* ===== 弹窗通用样式 ===== */
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9998;align-items:center;justify-content:center;padding:20px;}
.modal-mask.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;max-width:400px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid #edf2f7;display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:17px;font-weight:700;color:#2d3748;}
.modal-close{background:none;border:none;font-size:24px;color:#a0aec0;cursor:pointer;line-height:1;padding:0 4px;-webkit-tap-highlight-color:transparent;}
.modal-body{padding:18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.modal-footer{padding:14px 20px;border-top:1px solid #edf2f7;display:flex;gap:10px;}
.modal-btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;}
.modal-btn-cancel{background:#f7fafc;color:#718096;border:1px solid #e2e8f0;}
.modal-btn-confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.modal-btn-confirm:disabled{opacity:.5;cursor:not-allowed;}

/* 表单 - 弹窗内 */
.modal-form-row{margin-bottom:14px;}
.modal-form-row label{display:block;font-size:13px;color:#4a5568;margin-bottom:6px;font-weight:500;}
.modal-form-row label .req{color:#e53e3e;margin-left:2px;}
.modal-form-row input,.modal-form-row select{
  width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:10px 12px;
  font-size:14px;background:#fafafa;transition:all .15s;font-family:inherit;
}
.modal-form-row input:focus,.modal-form-row select:focus{
  border-color:#667eea;background:#fff;outline:none;
}
.modal-form-row .region-row{display:flex;gap:8px;}
.modal-form-row .region-row select{flex:1;}

/* Tab选择器（勘测类型/电梯类型） */
.tab-selector{display:flex;gap:8px;margin-bottom:14px;}
.tab-selector-item{flex:1;padding:10px;text-align:center;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;color:#718096;background:#fff;cursor:pointer;transition:all .15s;font-weight:500;-webkit-tap-highlight-color:transparent;}
.tab-selector-item.active{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600;}

/* 测量记录卡片底部按钮 */
.meas-card-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #edf2f7;}
.meas-action-btn{flex:1;padding:6px 0;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.meas-action-view{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.meas-action-print{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;}
.meas-action-delete{background:#fff5f5;color:#c53030;border:1px solid #fed7d7;}

@media(max-width:360px){
  .card-project{font-size:15px;}
  .stat-num{font-size:20px;}
}
</style>
</head>
<body>

<!-- 顶部Header -->
<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="header-back" onclick="goHome()">‹</div>
      <div class="header-title">土建勘测</div>
    </div>
    <div class="header-menu" onclick="toggleMenu(event)">≡
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-dropdown-item" onclick="goHome()">🏠 首页</div>
        <div class="menu-dropdown-divider"></div>
        <div class="menu-dropdown-item" onclick="exportData()">📤 导出数据</div>
        <div class="menu-dropdown-item" onclick="importData()">📥 导入数据</div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;">
      </div>
    </div>
  </div>
  <div class="header-sub">CIVIL SURVEY</div>
</div>

<!-- 统计卡片 -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="statProjects">0</div>
    <div class="stat-label">总项目</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statMeasurements">0</div>
    <div class="stat-label">总测量</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statSigned">0</div>
    <div class="stat-label">已签字</div>
  </div>
</div>

<!-- 列表区 -->
<div class="list-section">
  <div class="list-section-title">
    <span>勘测项目</span>
    <span class="list-count" id="listCount">共 0 个项目</span>
  </div>
  <div id="projectList"></div>
</div>

<!-- 悬浮新建按钮 -->
<div class="fab" onclick="openNewProjectModal()">+</div>

<div class="toast" id="toast"></div>

<!-- 确认删除弹窗 -->
<div class="confirm-mask" id="confirmMask">
  <div class="confirm-box">
    <h3 id="confirmTitle">确认删除</h3>
    <p id="confirmMsg">确定要删除吗？删除后无法恢复。</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="hideConfirm()">取消</button>
      <button class="confirm-ok" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

<!-- 新建项目弹窗 -->
<div class="modal-mask" id="newProjectModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">新建项目</div>
      <button class="modal-close" onclick="closeNewProjectModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-form-row">
        <label>项目名称<span class="req">*</span></label>
        <input type="text" id="np_projectName" placeholder="请输入项目名称">
      </div>
      <div class="modal-form-row">
        <label>勘测类型</label>
        <div class="tab-selector">
          <div class="tab-selector-item active" onclick="setSurveyType('首勘')" id="np_surveyType_first">首勘</div>
          <div class="tab-selector-item" onclick="setSurveyType('复勘')" id="np_surveyType_second">复勘</div>
        </div>
      </div>
      <div class="modal-form-row">
        <label>省 / 市 / 区县</label>
        <div class="region-row">
          <select id="np_province" onchange="npOnProvinceChange()">
            <option value="">请选择</option>
          </select>
          <select id="np_city" onchange="npOnCityChange()">
            <option value="">请选择</option>
          </select>
          <select id="np_district">
            <option value="">请选择</option>
          </select>
        </div>
      </div>
      <div class="modal-form-row">
        <label>详细地址</label>
        <input type="text" id="np_address" placeholder="请输入详细地址">
      </div>
      <div class="modal-form-row">
        <label>销售人员</label>
        <input type="text" id="np_sales" placeholder="请输入销售姓名">
      </div>
      <div class="modal-form-row">
        <label>联系电话</label>
        <input type="tel" id="np_phone" placeholder="请输入联系电话">
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeNewProjectModal()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="submitNewProject()">创建项目</button>
    </div>
  </div>
</div>

<!-- 编辑项目弹窗 -->
<div class="modal-mask" id="editProjectModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">编辑项目信息</div>
      <button class="modal-close" onclick="closeEditProjectModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-form-row">
        <label>项目名称<span class="req">*</span></label>
        <input type="text" id="ep_projectName" placeholder="请输入项目名称">
      </div>
      <div class="modal-form-row">
        <label>勘测类型</label>
        <div class="tab-selector">
          <div class="tab-selector-item active" onclick="setEditSurveyType('首勘')" id="ep_surveyType_first">首勘</div>
          <div class="tab-selector-item" onclick="setEditSurveyType('复勘')" id="ep_surveyType_second">复勘</div>
        </div>
      </div>
      <div class="modal-form-row">
        <label>省 / 市 / 区县</label>
        <div class="region-row">
          <select id="ep_province" onchange="epOnProvinceChange()">
            <option value="">请选择</option>
          </select>
          <select id="ep_city" onchange="epOnCityChange()">
            <option value="">请选择</option>
          </select>
          <select id="ep_district">
            <option value="">请选择</option>
          </select>
        </div>
      </div>
      <div class="modal-form-row">
        <label>详细地址</label>
        <input type="text" id="ep_address" placeholder="请输入详细地址">
      </div>
      <div class="modal-form-row">
        <label>销售人员</label>
        <input type="text" id="ep_sales" placeholder="请输入销售姓名">
      </div>
      <div class="modal-form-row">
        <label>联系电话</label>
        <input type="tel" id="ep_phone" placeholder="请输入联系电话">
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeEditProjectModal()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="submitEditProject()">保存修改</button>
    </div>
  </div>
</div>

<!-- 新建测量弹窗 -->
<div class="modal-mask" id="newMeasurementModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">新建测量记录</div>
      <button class="modal-close" onclick="closeNewMeasurementModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-form-row">
        <label>电梯类型</label>
        <div class="tab-selector">
          <div class="tab-selector-item active" onclick="setElevatorType('直梯')" id="nm_elevType_straight">直梯</div>
          <div class="tab-selector-item" onclick="setElevatorType('扶梯')" id="nm_elevType_escalator">扶梯</div>
        </div>
      </div>
      <div class="modal-form-row">
        <label>楼号 / 单元号 / 梯号</label>
        <div class="region-row">
          <input type="text" id="nm_buildingNo" placeholder="楼号" style="flex:1;">
          <input type="text" id="nm_unitNo" placeholder="单元号" style="flex:1;">
          <input type="text" id="nm_elevatorNo" placeholder="梯号" style="flex:1;">
        </div>
      </div>
      <div style="font-size:12px;color:#a0aec0;margin-top:-8px;line-height:1.5;">
        点击确定后进入测量详情页填写井道、楼层等参数
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeNewMeasurementModal()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="submitNewMeasurement()">确定并填写</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var STORAGE_KEY = 'wtCivilSurveyProjects';
var OLD_STORAGE_KEY = 'wtCivilSurveyList';
var projects = [];
var pendingDelete = null; // {type:'project'|'measurement', projectId, measurementId}
var currentNewProjectSurveyType = '首勘';
var currentEditProjectSurveyType = '首勘';
var currentNewMeasurementElevType = '直梯';
var currentNewMeasurementProjectId = null;
var currentEditProjectId = null;
var expandedProjectId = null;

// ============ 省市区数据（简化版） ============
var regionData = {
  "北京市": {
    "北京市": ["东城区","西城区","朝阳区","海淀区","丰台区","石景山区","通州区","昌平区","大兴区","顺义区","房山区","门头沟区","怀柔区","平谷区","密云区","延庆区"]
  },
  "天津市": {
    "天津市": ["和平区","河东区","河西区","南开区","河北区","红桥区","东丽区","西青区","津南区","北辰区","武清区","宝坻区","滨海新区","宁河区","静海区","蓟州区"]

// ============ 工具函数 ============
function showToast(msg, dur){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.style.display = 'none'; }, dur || 2000);
}

function escapeHtml(str){
  if(!str) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function formatDate(ts){
  if(!ts) return '';
  var d = new Date(ts);
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function genProjId(){
  return 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function genMeasId(){
  return 'meas_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

// ============ 数据加载保存 ============
function loadProjects(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    projects = raw ? JSON.parse(raw) : [];
  }catch(e){
    projects = [];
    console.error('加载失败', e);
  }
  // 按更新时间倒序
  projects.sort(function(a,b){ return (b.updateTime||0) - (a.updateTime||0); });
}

function saveProjects(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }catch(e){
    showToast('保存失败：' + (e.message||'未知错误'));
  }
}

// ============ 旧数据迁移 ============
function migrateOldData(){
  try{
    var oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
    if(!oldRaw) return 0;
    var oldList = JSON.parse(oldRaw);
    if(!Array.isArray(oldList) || oldList.length === 0) return 0;
    
    var migrated = 0;
    for(var i = 0; i < oldList.length; i++){
      var oldItem = oldList[i];
      // 为每条旧记录创建一个项目 + 一条测量记录
      var projId = genProjId();
      var measId = genMeasId();
      
      var loc = oldItem.location || {};
      
      // 测量记录数据：保留原记录所有字段，补充默认值
      var measurement = {};
      for(var key in oldItem){
        if(oldItem.hasOwnProperty(key)){
          measurement[key] = oldItem[key];
        }
      }
      measurement.id = measId;
      measurement.buildingNo = oldItem.buildingNo || '';
      measurement.unitNo = oldItem.unitNo || '';
      measurement.elevatorNo = oldItem.elevatorNo || '';
      measurement.elevatorType = oldItem.elevatorType || '直梯';
      measurement.createTime = oldItem.createTime || Date.now();
      measurement.updateTime = oldItem.updateTime || Date.now();
      
      // 项目数据
      var project = {
        id: projId,
        projectName: oldItem.projectName || '未命名项目',
        location: {
          province: loc.province || '',
          city: loc.city || '',
          district: loc.district || '',
          detail: loc.detail || ''
        },
        sales: oldItem.sales || '',
        phone: oldItem.phone || '',
        surveyType: oldItem.surveyType || '首勘',
        createTime: oldItem.createTime || Date.now(),
        updateTime: oldItem.updateTime || Date.now(),
        measurements: [measurement]
      };
      
      projects.push(project);
      migrated++;
    }
    
    saveProjects();
    // 迁移后清除旧数据（保留备份）
    localStorage.setItem(OLD_STORAGE_KEY + '_backup', oldRaw);
    localStorage.removeItem(OLD_STORAGE_KEY);
    
    return migrated;
  }catch(e){
    console.error('迁移失败', e);
    return 0;
  }
}

// ============ 统计 ============
function getTotalMeasurements(){
  var count = 0;
  for(var i = 0; i < projects.length; i++){
    if(projects[i].measurements){
      count += projects[i].measurements.length;
    }
  }
  return count;
}

function getSignedCount(){
  var count = 0;
  for(var i = 0; i < projects.length; i++){
    var meas = projects[i].measurements || [];
    for(var j = 0; j < meas.length; j++){
      if(meas[j].signatures && meas[j].signatures.surveyor){
        count++;
      }
    }
  }
  return count;
}

function toggleProjectExpand(projId){
  if(expandedProjectId === projId){
    expandedProjectId = null;
  }else{
    expandedProjectId = projId;
  }
  // 局部更新，不重新渲染全部
  var allCards = document.querySelectorAll('.project-card');
  for(var i = 0; i < allCards.length; i++){
    allCards[i].classList.remove('expanded');
  }
  if(expandedProjectId){
    var card = document.getElementById('projCard_' + expandedProjectId);
    if(card) card.classList.add('expanded');
  }
}

function confirmDeleteMeasurement(projId, measId){
  pendingDelete = { type: 'measurement', projectId: projId, measurementId: measId };
  document.getElementById('confirmTitle').textContent = '确认删除';
  document.getElementById('confirmMsg').textContent = '确定要删除这条测量记录吗？删除后无法恢复。';
  document.getElementById('confirmMask').classList.add('show');
}

function hideConfirm(){
  document.getElementById('confirmMask').classList.remove('show');
  pendingDelete = null;
}

function doDelete(){
  if(!pendingDelete) return;
  
  if(pendingDelete.type === 'measurement'){
    var proj = projects.find(function(p){ return p.id === pendingDelete.projectId; });
    if(proj && proj.measurements){
      proj.measurements = proj.measurements.filter(function(m){ return m.id !== pendingDelete.measurementId; });
      proj.updateTime = Date.now();
    }
  }
  
  saveProjects();
  renderList();
  hideConfirm();
  showToast('已删除');
}

function exportData(){
  if(!projects.length){ showToast('暂无数据可导出'); return; }
  var blob = new Blob([JSON.stringify(projects, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '土建勘测数据_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + projects.length + ' 个项目');
  document.getElementById('menuDropdown').classList.remove('show');
}

function importData(){
  document.getElementById('importFileInput').click();
  document.getElementById('menuDropdown').classList.remove('show');
}

document.getElementById('importFileInput').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error('格式错误');
      var added = 0;
      data.forEach(function(item){
        if(item && item.id && !projects.some(function(x){ return x.id === item.id; })){
          projects.push(item);
          added++;
        }
      });
      saveProjects();
      renderList();
      showToast('导入成功，新增 ' + added + ' 个项目');
    }catch(err){
      showToast('导入失败：' + (err.message||'格式错误'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ============ 初始化 ============
function init(){
  loadProjects();
  // 自动迁移旧数据
  var migrated = migrateOldData();
  if(migrated > 0){
    loadProjects();
    showToast('已自动迁移 ' + migrated + ' 条旧数据');
  }
  renderList();
}

init();
