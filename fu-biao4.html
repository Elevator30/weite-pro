<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附表4 导轨顶面距离测量</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "SimSun", "宋体", serif; font-size: 9px; line-height: 1.3; color: #000; background: #f5f5f5; padding: 10px; }
.page { width: 210mm; min-height: 297mm; padding: 10mm 8mm; margin: 0 auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { text-align: left; font-size: 12px; font-weight: bold; margin-bottom: 6px; width: 120mm; margin-left: auto; margin-right: auto; }
table { width: 120mm; border-collapse: collapse; font-size: 8px; table-layout: fixed; margin: 0 auto; }
th, td { border: 1px solid #333; padding: 2px 2px; text-align: center; vertical-align: middle; word-break: break-all; }
th { font-weight: bold; background: #fff; }

/* 8列: A B C D E F G H */
.col-a { width: 15mm; }
.col-b { width: 15mm; }
.col-c { width: 15mm; }
.col-d { width: 15mm; }
.col-e { width: 15mm; }
.col-f { width: 15mm; }
.col-g { width: 15mm; }
.col-h { width: 15mm; }

.data-row td { height: 22px; }
.tol { font-size: 7px; }

@media print {
  body { background: #fff; padding: 0; }
  .page { box-shadow: none; margin: 0; width: 100%; min-height: auto; padding: 8mm; }
  @page { size: A4 portrait; margin: 0; }
}
</style>
</head>
<body>

<div class="page">
  <h1>附表4 导轨顶面距离测量（单位mm）</h1>
  
  <table>
    <colgroup>
      <col class="col-a"><col class="col-b"><col class="col-c"><col class="col-d">
      <col class="col-e"><col class="col-f"><col class="col-g"><col class="col-h">
    </colgroup>

    <!-- 行2：大标题 -->
    <tr>
      <th colspan="2">轿厢导轨面距基准：</th>
      <th>mm</th>
      <th class="tol">（0~﹢2）</th>
      <th colspan="2">对重导轨面距基准：</th>
      <th>mm</th>
      <th class="tol">（0~﹢3）</th>
    </tr>
    <!-- 行3：测点1 -->
    <tr class="data-row">
      <td>1</td>
      <td></td>
      <td>6</td>
      <td></td>
      <td>1</td>
      <td></td>
      <td>6</td>
      <td></td>
    </tr>
    <!-- 行4：测点2 -->
    <tr class="data-row">
      <td>2</td>
      <td></td>
      <td>7</td>
      <td></td>
      <td>2</td>
      <td></td>
      <td>7</td>
      <td></td>
    </tr>
    <!-- 行5：测点3 -->
    <tr class="data-row">
      <td>3</td>
      <td></td>
      <td>8</td>
      <td></td>
      <td>3</td>
      <td></td>
      <td>8</td>
      <td></td>
    </tr>
    <!-- 行6：测点4 -->
    <tr class="data-row">
      <td>4</td>
      <td></td>
      <td>9</td>
      <td></td>
      <td>4</td>
      <td></td>
      <td>9</td>
      <td></td>
    </tr>
    <!-- 行7：测点5 -->
    <tr class="data-row">
      <td>5</td>
      <td></td>
      <td>10</td>
      <td></td>
      <td>5</td>
      <td></td>
      <td>10</td>
      <td></td>
    </tr>
    <!-- 行8：最大偏差 -->
    <tr class="data-row">
      <th colspan="2">最大偏差</th>
      <td colspan="2"></td>
      <td colspan="4"></td>
    </tr>
  </table>
</div>

</body>
</html>
