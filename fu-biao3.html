<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附表3 导轨工作面铅垂度测量表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "SimSun", "宋体", serif; font-size: 9px; line-height: 1.3; color: #000; background: #f5f5f5; padding: 10px; }
.page { width: 210mm; min-height: 297mm; padding: 10mm 8mm; margin: 0 auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { text-align: left; font-size: 12px; font-weight: bold; margin-bottom: 6px; width: 86mm; margin-left: auto; margin-right: auto; }
table { width: 86mm; border-collapse: collapse; font-size: 8px; table-layout: fixed; margin: 0 auto; }
th, td { border: 1px solid #333; padding: 2px 2px; text-align: center; vertical-align: middle; word-break: break-all; }
th { font-weight: bold; background: #fff; }
.vertical-text { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; font-weight: bold; }

/* 13列: A B C D E F G H I J K L M */
.col-a { width: 8mm; }
.col-b { width: 8mm; }
.col-c { width: 6mm; }
.col-d { width: 6mm; }
.col-e { width: 6mm; }
.col-f { width: 6mm; }
.col-g { width: 6mm; }
.col-h { width: 6mm; }
.col-i { width: 6mm; }
.col-j { width: 6mm; }
.col-k { width: 6mm; }
.col-l { width: 6mm; }
.col-m { width: 10mm; }

.data-row td { height: 22px; }
.remark-row td { font-size: 7px; line-height: 1.5; text-align: left; padding-left: 4px; }

@media print {
  body { background: #fff; padding: 0; }
  .page { box-shadow: none; margin: 0; width: 100%; min-height: auto; padding: 8mm; }
  @page { size: A4 portrait; margin: 0; }
}
</style>
</head>
<body>

<div class="page">
  <h1>附表3 导轨工作面铅垂度测量表（单位mm）</h1>
  
  <table>
    <colgroup>
      <col class="col-a"><col class="col-b">
      <col class="col-c"><col class="col-d"><col class="col-e"><col class="col-f">
      <col class="col-g"><col class="col-h"><col class="col-i"><col class="col-j">
      <col class="col-k"><col class="col-l"><col class="col-m">
    </colgroup>

    <!-- 行2：序号表头 -->
    <tr>
      <th colspan="2">序&nbsp;&nbsp;&nbsp;&nbsp;号</th>
      <th>1</th>
      <th>2</th>
      <th>3</th>
      <th>4</th>
      <th>5</th>
      <th>6</th>
      <th>7</th>
      <th>8</th>
      <th>9</th>
      <th>10</th>
      <th>最大偏差</th>
    </tr>
    <!-- 行3：轿厢左导轨 -->
    <tr class="data-row">
      <th rowspan="2">轿厢</th>
      <th>左导轨</th>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    </tr>
    <!-- 行4：轿厢右导轨 -->
    <tr class="data-row">
      <th>右导轨</th>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    </tr>
    <!-- 行5：对重左导轨 -->
    <tr class="data-row">
      <th rowspan="2">对重</th>
      <th>左导轨</th>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    </tr>
    <!-- 行6：对重右导轨 -->
    <tr class="data-row">
      <th>右导轨</th>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    </tr>
    <!-- 行7：备注 -->
    <tr class="remark-row">
      <td colspan="13">每列导轨工作面每5m铅垂线测量值间的相对最大偏差，轿厢导轨和设有安全钳的T型对重导轨不大于1.2mm，不设安全钳的T型对重导轨不大于2.0mm；</td>
    </tr>
  </table>
</div>

</body>
</html>
